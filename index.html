<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday — Tournament Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#070b0f;
    --card:#0e1814;
    --card2:#0b1010;
    --card3:#111c17;
    --border:#1c2b26;
    --text:#dde4ee;
    --text-secondary:#8899aa;
    --text-faint:#445566;
    --gold:#FFD700;
    --green:#00C853;
    --purple:#E040FB;
    --orange:#FF6B35;
    --blue:#29B6F6;
    --primary:var(--green);
    --primary-dark:#00A344;
    --primary-light:rgba(0,200,83,.14);
    --accent:var(--blue);
    --success:var(--green);
    --success-bg:rgba(0,200,83,.12);
    --warning:var(--orange);
    --warning-bg:rgba(255,107,53,.12);
    --error:#FF5252;
    --error-bg:rgba(255,82,82,.12);
    --display:'Segoe UI', system-ui, sans-serif;
    --body:'Segoe UI', system-ui, sans-serif;
    --mono:'JetBrains Mono', monospace;
    --r-sm:6px;
    --r-md:8px;
    --r-lg:10px;
    --shadow-sm:none;
    --shadow-md:none;
    --shadow-lg:0 0 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html{scrollbar-color: var(--border) var(--bg);}
  body{
    margin:0; color:var(--text);
    font-family:var(--body);
    -webkit-font-smoothing:antialiased;
    background-color:var(--bg);
    min-height:100vh;
  }
  ::selection{background:var(--gold); color:#1a1200;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px; border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
  }
  #root{max-width:960px; margin:0 auto; padding:0 18px 90px;}

  /* ===== Header ===== */
  .ticker{display:none;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding:16px 0; position:sticky; top:0; z-index:30; margin-bottom:24px;
    background:rgba(7,11,15,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--border);
  }
  .topbar-actions{display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;}
  .topbar-email{max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:inline-block; vertical-align:middle;}
  @media(max-width:480px){ .topbar-email{ display:none; } }
  .brand{display:flex; align-items:center; gap:10px; cursor:pointer; transition:opacity .15s;}
  .brand:hover{opacity:.75;}
  .brand .mark{
    font-family:var(--display); font-weight:800; font-size:18px; letter-spacing:.3px;
    color:var(--text); line-height:1;
  }
  .brand .mark::before{
    content:'⚽'; display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; background:var(--card3); border:1px solid var(--gold); border-radius:var(--r-sm); margin-right:8px;
    font-size:13px; vertical-align:middle;
  }
  .brand .sub{display:none;}

  .btn{
    font-family:var(--body); font-weight:700; font-size:13px; letter-spacing:0;
    border:1px solid var(--border); background:var(--card2); color:var(--text);
    padding:9px 16px; border-radius:var(--r-md); cursor:pointer;
    transition:border-color .15s, background .15s, color .15s;
  }
  .btn:hover{border-color:var(--text-faint); background:var(--card3);}
  .btn:active{opacity:.85;}
  .btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  .btn-gold{background:var(--gold); color:#1a1200; border-color:var(--gold); font-weight:800;}
  .btn-gold:hover{background:#ffe14d; border-color:#ffe14d;}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:6px 12px; font-size:12px; border-radius:var(--r-sm);}
  .btn-danger{border-color:rgba(255,82,82,.4); color:var(--error); background:var(--error-bg);}
  .btn-danger:hover{background:var(--error); color:#fff;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  /* ===== Dashboard stats row ===== */
  .stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:26px;}
  @media(max-width:640px){.stats-row{grid-template-columns:1fr 1fr;}}
  @media(max-width:380px){.stats-row{grid-template-columns:1fr;}}
  .stat-widget{
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px 18px;
    border-left:3px solid var(--green);
  }
  .stat-widget:nth-child(2){border-left-color:var(--blue);}
  .stat-widget:nth-child(3){border-left-color:var(--gold);}
  .stat-widget .sw-icon{
    width:30px; height:30px; border-radius:var(--r-sm); background:var(--card3); color:var(--text);
    display:flex; align-items:center; justify-content:center; font-size:15px; margin-bottom:10px;
  }
  .stat-widget .sw-value{font-family:var(--display); font-weight:800; font-size:26px; letter-spacing:-.3px; line-height:1; color:var(--text);}
  .stat-widget .sw-label{color:var(--text-secondary); font-size:9px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; margin-top:6px;}

  /* ===== Home ===== */
  .hero{padding:4px 0;}
  .hero h1{
    font-family:var(--display); font-weight:800; font-size:28px; letter-spacing:-.3px;
    margin:0 0 4px; line-height:1.2; color:var(--text);
  }
  .hero p{color:var(--text-secondary); margin:0 0 20px; font-size:13.5px; max-width:540px;}

  .empty{
    border:1px dashed var(--border); border-radius:var(--r-lg); padding:44px 20px; text-align:center; color:var(--text-secondary);
    background:var(--card);
  }
  .empty .mark-lg{font-family:var(--display); font-weight:700; font-size:18px; color:var(--text); display:block; margin-bottom:6px;}
  .empty::before{content:'⚽'; display:block; font-size:24px; margin-bottom:10px; opacity:.5;}

  .t-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  @media(max-width:640px){.t-grid{grid-template-columns:1fr;}}
  .t-card{
    background:var(--card); border:1px solid var(--border); border-left:4px solid var(--green); border-radius:var(--r-md); padding:18px;
    cursor:pointer; transition:background .15s, border-color .15s; position:relative; overflow:hidden;
  }
  .t-card:nth-child(3n+2){border-left-color:var(--blue);}
  .t-card:nth-child(3n+3){border-left-color:var(--gold);}
  .t-card:hover{background:var(--card3); border-left-color:var(--purple);}
  .t-card .badge{
    font-family:var(--body); font-size:9px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--green); background:rgba(0,200,83,.12); border-radius:20px; padding:4px 10px; display:inline-block; margin-bottom:12px;
  }
  .t-card h3{font-family:var(--display); font-weight:800; font-size:18px; margin:0 0 6px; letter-spacing:-.2px; color:var(--text);}
  .t-card .meta{color:var(--text-secondary); font-size:11px; font-family:var(--body); font-weight:600;}
  .t-card .stage-pill{position:absolute; top:18px; right:18px; font-family:var(--body); font-size:9px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:1px;}

  /* ===== Section divider ===== */
  .stub{display:flex; align-items:center; gap:12px; margin:30px 0 16px; color:var(--text-faint);}
  .stub .dash{flex:1; border-top:1px solid var(--border);}
  .stub .label{font-family:var(--body); font-size:9px; font-weight:800; letter-spacing:2.5px; text-transform:uppercase; color:var(--text-secondary); white-space:nowrap;}

  /* ===== Panels / forms ===== */
  .panel{background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:22px;}
  label{display:block; font-size:9px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-secondary); margin-bottom:7px; margin-top:16px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=password], select{
    width:100%; background:var(--card2); border:1px solid var(--border); color:var(--text);
    border-radius:var(--r-md); padding:10px 12px; font-family:var(--body); font-size:14px;
    transition:border-color .15s;
  }
  input:focus, select:focus{outline:none; border-color:var(--gold);}
  .row{display:flex; gap:12px;}
  .row > *{flex:1;}
  .hint{font-size:11px; color:var(--text-faint); margin-top:6px;}
  .team-input-row{display:flex; gap:8px; align-items:center; margin-top:8px;}
  .team-input-row input{flex:1;}
  .num-badge{font-family:var(--mono); font-size:11px; color:var(--text-faint); width:22px; text-align:right;}
  fieldset{border:none; padding:0; margin:0;}
  .type-choice{display:flex; gap:10px; margin-top:6px; flex-wrap:wrap;}
  .type-opt{
    flex:1; min-width:120px; border:1px solid var(--border); border-radius:var(--r-md); padding:14px; cursor:pointer; background:var(--card2);
    transition:.15s;
  }
  .type-opt:hover{border-color:var(--text-faint);}
  .type-opt.active{border-color:var(--gold); background:rgba(255,215,0,.06);}
  .type-opt h4{font-family:var(--display); font-weight:800; font-size:15px; margin:0 0 4px; letter-spacing:-.1px; color:var(--text);}
  .type-opt p{font-size:11px; color:var(--text-secondary); margin:0;}

  /* ===== Tournament header (standard, non-Swiss) ===== */
  .t-header{
    display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:22px 24px;
  }
  .t-header h1{font-family:var(--display); font-weight:800; font-size:24px; margin:0; letter-spacing:-.3px; line-height:1.2; color:var(--text);}
  .badge{
    font-family:var(--body); font-size:9px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold);
    background:rgba(255,215,0,.1); border-radius:20px; padding:4px 11px; display:inline-block;
  }
  .t-header .badge{margin-bottom:10px;}
  .lock-box{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .lock-status{font-family:var(--body); font-size:10.5px; font-weight:700; padding:7px 12px; border-radius:20px; background:var(--card3); color:var(--text-secondary); border:1px solid var(--border);}
  .lock-status.unlocked{background:var(--success-bg); color:var(--green); border-color:rgba(0,200,83,.3);}

  /* ===== Swiss League UCL-style hero ===== */
  .ucl-hero{
    position:relative; overflow:hidden; border-radius:var(--r-lg) var(--r-lg) 0 0;
    background:linear-gradient(135deg, #1a1200, #0a0814, #001a08);
    border-bottom:3px solid var(--gold);
    padding:26px 20px 22px; text-align:center;
  }
  .ucl-hero::before{
    content:''; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background:radial-gradient(circle at 15% 10%, rgba(255,215,0,.10), transparent 55%), radial-gradient(circle at 85% 90%, rgba(0,200,83,.10), transparent 55%);
  }
  .ucl-hero-season{position:relative; font-family:var(--body); font-size:11px; font-weight:700; letter-spacing:4px; text-transform:uppercase; color:var(--gold); margin-bottom:8px;}
  .ucl-hero-title{
    position:relative; font-family:var(--display); font-weight:800; font-size:clamp(20px,6vw,34px); letter-spacing:1px; text-transform:uppercase;
    margin:0 0 10px; line-height:1.15;
    background:linear-gradient(90deg, var(--gold), #ff9a3d, var(--purple), var(--blue), var(--green));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .ucl-hero-divider{position:relative; display:flex; align-items:center; justify-content:center; gap:10px; color:var(--text-secondary); font-family:var(--body); font-size:10px; font-weight:700; letter-spacing:3px; text-transform:uppercase; margin-bottom:8px;}
  .ucl-hero-divider span:not(.ucl-hero-divider-label){width:34px; height:1px; background:rgba(255,215,0,.5);}
  .ucl-hero-tagline{position:relative; font-size:12px; color:var(--text-faint);}
  .ucl-hero-bottom{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background:var(--card); border:1px solid var(--border); border-top:none; border-radius:0 0 var(--r-lg) var(--r-lg);
    padding:14px 20px;
  }

  .tabs{display:flex; gap:2px; margin:22px 0 4px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .tab{
    font-family:var(--body); font-weight:700; font-size:12.5px; letter-spacing:.5px; text-transform:uppercase; padding:10px 14px; cursor:pointer; color:var(--text-faint);
    border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .15s, border-color .15s;
  }
  .tab:hover{color:var(--text-secondary);}
  .tab.active{color:var(--gold); border-color:var(--gold);}

  /* ===== Standings table ===== */
  table.standings{width:100%; border-collapse:collapse; margin-top:6px;}
  table.standings th{
    text-align:center; font-family:var(--body); font-size:9px; font-weight:800; letter-spacing:1.5px; color:var(--text-faint);
    text-transform:uppercase; padding:10px 8px; border-bottom:1px solid var(--border);
  }
  table.standings th:first-child, table.standings td:first-child{text-align:left; padding-left:4px;}
  table.standings th.team-col, table.standings td.team-col{text-align:left;}
  table.standings td{
    text-align:center; padding:11px 8px; font-family:var(--mono); font-size:12.5px; border-bottom:1px solid var(--border);
    color:var(--text-secondary);
  }
  table.standings tbody tr:hover td{background:var(--card2);}
  table.standings tr:last-child td{border-bottom:none;}
  .pos-box{
    display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;
    background:var(--card3); border-radius:var(--r-sm);
    font-family:var(--display); font-weight:800; font-size:13px; color:var(--text-secondary);
  }
  tr.qualify .pos-box{background:var(--green); color:#04150a;}
  td.team-name{font-family:var(--body); font-weight:700; font-size:13px; color:var(--text);}
  td.pts{font-weight:800; color:var(--gold); font-family:var(--mono);}
  .form-pills{display:flex; gap:4px; justify-content:center;}
  .pill{width:16px; height:16px; border-radius:50%; font-size:0; display:flex; align-items:center; justify-content:center; border:1.5px solid transparent;}
  .pill.W{background:var(--green);}
  .pill.D{background:transparent; border-color:var(--text-faint);}
  .pill.L{background:var(--error);}

  /* ===== Fixtures / matches ===== */
  .group-block{margin-bottom:26px;}
  .group-title{font-family:var(--display); font-weight:800; font-size:16px; letter-spacing:-.1px; margin:0 0 10px; color:var(--text);}
  .match-list{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .match-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:13px 15px;
    display:flex; align-items:center; gap:10px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .match-card:hover{border-color:var(--text-faint); background:var(--card3);}
  .match-card.played{background:var(--card);}
  .match-teams{flex:1; display:flex; align-items:center; justify-content:center; gap:10px; font-size:13px;}
  .match-teams .side{flex:1; font-weight:700; color:var(--text);}
  .match-teams .side.home{text-align:right;}
  .match-teams .side.away{text-align:left;}
  .score-box{
    font-family:var(--display); font-weight:800; font-size:17px; letter-spacing:0; color:var(--gold);
    min-width:58px; text-align:center; background:var(--card3); border-radius:var(--r-sm); padding:4px 8px;
  }
  .score-box.unplayed{color:var(--text-faint); font-family:var(--body); font-size:10.5px; font-weight:700; background:var(--card2);}
  .thumb{width:34px; height:34px; border-radius:var(--r-sm); object-fit:cover; border:1px solid var(--border); flex-shrink:0;}
  .thumb-placeholder{width:34px; height:34px; flex-shrink:0;}

  /* ===== Bracket ===== */
  .bracket{display:flex; gap:32px; overflow-x:auto; padding:14px 4px 24px;}
  .bracket-round{display:flex; flex-direction:column; justify-content:space-around; min-width:186px; gap:16px;}
  .round-label{font-family:var(--body); font-size:9px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--text-faint); text-align:center; margin-bottom:4px;}
  .bk-match{
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); padding:10px 12px; position:relative; cursor:pointer;
    transition:border-color .15s;
  }
  .bk-match:hover{border-color:var(--text-faint);}
  .bk-match.decided{border-color:var(--gold);}
  .bk-side{display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:12px; font-weight:600; color:var(--text-secondary);}
  .bk-side.winner{color:var(--gold); font-weight:800;}
  .bk-side .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:108px;}
  .bk-side .sc{font-family:var(--mono); font-weight:700;}
  .bk-divider{border-top:1px solid var(--border); margin:2px 0;}
  .bye-tag{font-family:var(--body); font-size:9px; font-weight:700; color:var(--text-faint); letter-spacing:.5px;}

  /* ===== Awards / trophies ===== */
  .trophy-row{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:10px;}
  @media(max-width:640px){.trophy-row{grid-template-columns:1fr;}}
  .trophy-card{
    background:var(--card); border:1px solid var(--border); border-left:3px solid var(--gold); border-radius:var(--r-md); padding:18px; text-align:center;
  }
  .trophy-card:nth-child(2){border-left-color:var(--blue);}
  .trophy-card:nth-child(3){border-left-color:var(--purple);}
  .trophy-card.empty-trophy{border-left-color:var(--border);}
  .trophy-label{font-family:var(--body); font-size:9px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:8px;}
  .trophy-name{font-family:var(--display); font-weight:800; font-size:19px; letter-spacing:-.2px; color:var(--text);}
  .trophy-team{font-size:11px; color:var(--text-secondary); margin-bottom:6px;}
  .trophy-stat{font-family:var(--mono); font-size:11px; color:var(--text-faint);}

  .match-card-row{display:flex; flex-direction:column; gap:6px;}
  .match-actions{display:flex; gap:8px; justify-content:flex-end; align-items:center;}
  .stats-badge{
    font-family:var(--body); font-size:9.5px; font-weight:700; color:var(--green); border:1px solid rgba(0,200,83,.3); border-radius:20px;
    padding:3px 9px; white-space:nowrap; background:rgba(0,200,83,.1);
  }

  .stat-cols{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:14px;}
  @media(max-width:520px){.stat-cols{grid-template-columns:1fr;}}
  .stat-col-title{font-family:var(--display); font-weight:800; font-size:14px; margin-bottom:8px; color:var(--text);}
  .stat-col-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px;}
  .goal-event-row{display:grid; grid-template-columns:56px 110px 1fr 28px; gap:6px; align-items:center; margin-top:6px;}
  .goal-event-row input, .goal-event-row select{padding:7px 8px; font-size:12.5px;}
  .goal-event-row input[type=number]{text-align:center;}
  .stat-row{display:grid; grid-template-columns:130px 38px 38px 38px 38px 38px 38px 28px; gap:6px; align-items:center; margin-bottom:6px;}
  .stat-row input[type=text]{padding:7px 8px; font-size:12.5px;}
  .stat-row input[type=number]{padding:7px 2px; font-size:13px; text-align:center;}
  .stat-row .rm{background:var(--error-bg); border:1px solid rgba(255,82,82,.3); color:var(--error); cursor:pointer; font-size:13px; border-radius:6px; padding:4px;}
  .stat-row .rm:hover{background:var(--error); color:#fff;}
  .stat-head{display:grid; grid-template-columns:130px 38px 38px 38px 38px 38px 38px 28px; gap:6px; font-family:var(--body); font-size:9px; font-weight:800; color:var(--text-faint); text-transform:uppercase; margin-bottom:4px;}
  .stat-head span{text-align:center;}
  .stat-head span:first-child{text-align:left;}
  .ocr-box{width:100%; background:var(--card2); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--text-secondary); font-family:var(--mono); font-size:10.5px; padding:8px; margin-top:8px; min-height:70px;}

  /* ===== Modal ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(2,4,6,.75); display:flex; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal{
    background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:24px;
    max-width:440px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg);
  }

<script>
/* =========================================================
   MATCHDAY — tournament tracker
   Storage: shared key/value via window.storage
   ========================================================= */

/* ---------------- Supabase config ---------------- */
const SUPABASE_URL = "https://gtiinnqptpapbmcrudag.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_h0h5xXU0uRmaSr8LqmJoYg_92zff6iT";

let supabaseClient = null;
function sandboxSafeFetch(url, options){
  options = options || {};
  if(options.headers && typeof Headers !== 'undefined' && options.headers instanceof Headers){
    const plain = {};
    options.headers.forEach((v,k) => { plain[k] = v; });
    options = { ...options, headers: plain };
  }
  return fetch(url, options);
}
/* Auth session storage — tries localStorage, falls back to in-memory if the
   host environment restricts it (e.g. a sandboxed preview). Falling back
   means the session won't survive a hard page reload there, but login still
   works within the loaded session. Real hosting (Vercel etc.) has normal
   localStorage and gets full persistence. */
const memoryAuthStorage = {};
const safeAuthStorage = {
  getItem(key){ try{ return localStorage.getItem(key); }catch(e){ return memoryAuthStorage[key] ?? null; } },
  setItem(key, value){ try{ localStorage.setItem(key, value); }catch(e){ memoryAuthStorage[key] = value; } },
  removeItem(key){ try{ localStorage.removeItem(key); }catch(e){ delete memoryAuthStorage[key]; } }
};
if(window.supabase && SUPABASE_URL && SUPABASE_ANON_KEY){
  try{
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: { fetch: sandboxSafeFetch },
      auth: { storage: safeAuthStorage, persistSession: true, autoRefreshToken: true }
    });
  }catch(e){ supabaseClient = null; }
}

let state = {
  view: "loading",     // loading | login | signup | pending | suspended | organizer-home | admin | new | tournament | public-viewer
  activeTab: "standings",
  tournamentsIndex: [],     // organizer/admin: tournaments visible to them
  currentTournament: null,
  session: null,             // Supabase auth session
  profile: null,             // { id, email, role, status }
  organizers: [],            // admin: list of all organizer profiles
  publicTournamentId: null,  // set when opened via ?t=<id> link
  loading: true,
  modal: null,
  err: null,
  authErr: null,
  justSavedMatchId: null,
};

function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ---------------- storage helpers ---------------- */
/* ---------------- auth & profile ---------------- */
async function fetchSession(){
  const { data } = await supabaseClient.auth.getSession();
  return data.session || null;
}
async function fetchMyProfile(userId){
  const { data, error } = await supabaseClient.from('profiles').select('*').eq('id', userId).maybeSingle();
  if(error) throw error;
  return data;
}
async function doSignup(email, password){
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if(error) throw error;
  return data;
}
async function doLogin(email, password){
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error) throw error;
  return data;
}
async function doLogout(){
  await supabaseClient.auth.signOut();
}

/* ---------------- tournaments data layer (relational, RLS-enforced) ---------------- */
function rowToTournament(row){
  return { ...row.data, id: row.id, name: row.name, type: row.type, organizer_id: row.organizer_id, is_public: row.is_public };
}
async function loadMyTournaments(){
  const { data, error } = await supabaseClient.from('tournaments').select('id,name,type,data,organizer_id,is_public,created_at').order('created_at', { ascending:false });
  if(error) throw error;
  return (data||[]).map(row => {
    const teamCount = (row.data.teams||[]).length;
    const matchCount = (row.type==='league' || row.type==='swiss') ? (row.data.matches||[]).length : (row.data.groupMatches||[]).length;
    const stageLabel = row.type==='cup' ? (row.data.stage==='groups' ? 'Group stage' : 'Knockout') : '';
    return { id: row.id, name: row.name, type: row.type, teamCount, matchCount, stageLabel, organizer_id: row.organizer_id };
  });
}
async function loadTournamentRow(id){
  const { data, error } = await supabaseClient.from('tournaments').select('*').eq('id', id).maybeSingle();
  if(error) throw error;
  return data ? rowToTournament(data) : null;
}
async function createTournamentRow(t){
  const payload = { organizer_id: state.session.user.id, name: t.name, type: t.type, is_public: true, data: t };
  const { data, error } = await supabaseClient.from('tournaments').insert(payload).select().single();
  if(error) throw error;
  return rowToTournament(data);
}
async function saveTournament(t){
  const { id, organizer_id, is_public, ...rest } = t;
  const { error } = await supabaseClient.from('tournaments').update({ name: t.name, type: t.type, data: t }).eq('id', id);
  if(error) throw error;
}
async function deleteTournamentRow(id){
  const { error } = await supabaseClient.from('tournaments').delete().eq('id', id);
  if(error) throw error;
}

function canEditTournament(t){
  if(!state.profile) return false;
  return t.organizer_id === state.profile.id;
}
function isAdmin(){ return !!state.profile && state.profile.role === 'platform_admin' && state.profile.status === 'active'; }

/* ---------------- admin: manage organizers ---------------- */
async function loadOrganizers(){
  const { data, error } = await supabaseClient.from('profiles').select('*').order('created_at', { ascending:false });
  if(error) throw error;
  return (data||[]).filter(p => p.role === 'organizer');
}
async function setOrganizerStatus(profileId, status){
  const { error } = await supabaseClient.from('profiles').update({ status }).eq('id', profileId);
  if(error) throw error;
}

/* ---------------- image compression ---------------- */
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- standings ---------------- */
function computeStandings(teams, matches){
  const table = {};
  teams.forEach(t => table[t.id] = {id:t.id, name:t.name, P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0, form:[]});
  matches.filter(m => m.played && table[m.home] && table[m.away])
    .forEach(m => {
      const h = table[m.home], a = table[m.away];
      h.P++; a.P++;
      h.GF += m.homeScore; h.GA += m.awayScore;
      a.GF += m.awayScore; a.GA += m.homeScore;
      if(m.homeScore > m.awayScore){ h.W++; h.Pts+=3; a.L++; h.form.push('W'); a.form.push('L'); }
      else if(m.homeScore < m.awayScore){ a.W++; a.Pts+=3; h.L++; a.form.push('W'); h.form.push('L'); }
      else { h.D++; a.D++; h.Pts+=1; a.Pts+=1; h.form.push('D'); a.form.push('D'); }
    });
  Object.values(table).forEach(t => t.GD = t.GF - t.GA);
  return Object.values(table).sort((x,y) => y.Pts-x.Pts || y.GD-x.GD || y.GF-x.GF || x.name.localeCompare(y.name));
}

/* ---------------- stat aggregation ---------------- */
function collectAllMatches(t){
  if(t.type === 'league' || t.type === 'swiss') return t.matches;
  const all = [...t.groupMatches];
  if(t.knockout) t.knockout.rounds.forEach(r => all.push(...r.matches));
  return all;
}
function aggregateStats(t){
  const teamsById = Object.fromEntries(t.teams.map(x => [x.id, x]));
  const all = collectAllMatches(t);
  const players = {};
  function ensure(teamId, name){
    const key = teamId + '|' + name.trim().toLowerCase();
    if(!players[key]) players[key] = { name:name.trim(), teamId, goals:0, assists:0, fouls:0, offsides:0, yellows:0, reds:0, potm:0, cleanSheets:0 };
    return players[key];
  }
  all.forEach(m => {
    if(m.stats){
      (m.stats.home||[]).forEach(r => { if(r.name && r.name.trim()){ const p=ensure(m.home,r.name); p.goals+=+r.goals||0; p.assists+=+r.assists||0; p.fouls+=+r.fouls||0; p.offsides+=+r.offsides||0; p.yellows+=+r.yellows||0; p.reds+=+r.reds||0; } });
      (m.stats.away||[]).forEach(r => { if(r.name && r.name.trim()){ const p=ensure(m.away,r.name); p.goals+=+r.goals||0; p.assists+=+r.assists||0; p.fouls+=+r.fouls||0; p.offsides+=+r.offsides||0; p.yellows+=+r.yellows||0; p.reds+=+r.reds||0; } });
    }
    if(m.potm && m.potm.name && m.potm.name.trim()){
      const teamId = m.potm.side === 'home' ? m.home : m.away;
      ensure(teamId, m.potm.name).potm += 1;
    }
    if(m.played && m.gk){
      if(m.gk.home && m.gk.home.trim() && m.awayScore === 0) ensure(m.home, m.gk.home).cleanSheets += 1;
      if(m.gk.away && m.gk.away.trim() && m.homeScore === 0) ensure(m.away, m.gk.away).cleanSheets += 1;
    }
  });
  return Object.values(players).map(p => ({ ...p, teamName: teamsById[p.teamId]?.name || '—' }));
}

/* ---------------- fixture generation ---------------- */
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Standard circle-method round-robin scheduler: splits all pairings into
   "matchdays" where every team appears at most once per matchday (one team
   sits out on a bye if the count is odd). */
function buildRoundRobinRounds(teamIds){
  let arr = shuffleArray(teamIds);
  if(arr.length % 2 !== 0) arr.push(null);
  const n = arr.length;
  const half = n/2;
  const rounds = [];
  let cur = arr.slice();
  for(let r=0;r<n-1;r++){
    const pairs = [];
    for(let i=0;i<half;i++){
      const a = cur[i], b = cur[n-1-i];
      if(a!==null && b!==null) pairs.push([a,b]);
    }
    rounds.push(pairs);
    const fixed = cur[0];
    const rest = cur.slice(1);
    rest.unshift(rest.pop());
    cur = [fixed, ...rest];
  }
  return rounds;
}

/* Shuffles a matchday's fixture order, and — where a valid option exists —
   puts a fixture with no carry-over team first, so the previous matchday's
   closing fixture and this one's opener don't share a team. */
function orderRoundMinimizingAdjacency(pairs, forbiddenTeams){
  const arr = shuffleArray(pairs);
  let idx = arr.findIndex(([a,b]) => !forbiddenTeams.includes(a) && !forbiddenTeams.includes(b));
  if(idx === -1) idx = 0; // no clash-free option exists this round — unavoidable with this team count
  if(idx > 0){ const item = arr.splice(idx,1)[0]; arr.unshift(item); }
  return arr;
}

function generateFixtures(teamIds, rounds){
  const matches = [];
  let forbidden = [];
  for(let rep=0; rep<rounds; rep++){
    const rrRounds = buildRoundRobinRounds(teamIds);
    rrRounds.forEach(pairs => {
      const ordered = orderRoundMinimizingAdjacency(pairs, forbidden);
      ordered.forEach(([a,b]) => {
        const swap = Math.random() < 0.5;
        matches.push({
          id: genId(), home: swap?b:a, away: swap?a:b,
          homeScore:null, awayScore:null, played:false, photo:null, playedAt:null,
          stats:{home:[], away:[]}, potm:null, statsPhoto:null, teamStats:{home:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}, away:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}}, goalEvents:[]
        });
      });
      forbidden = ordered.length ? [ordered[ordered.length-1][0], ordered[ordered.length-1][1]] : [];
    });
  }
  return matches;
}

/* ---------------- Swiss League fixture generation ----------------
   Uses the same proven circle-method round-robin engine: since each
   matchday in a round-robin schedule is internally duplicate-free,
   taking the first N matchdays already guarantees every team gets N
   distinct opponents, no repeats, no self-play. A short repair pass
   afterwards tops up any team that's short (only relevant with odd
   team counts, where a bye rotates through). */
function generateSwissFixtures(teamIds, numMatches){
  const rrRounds = buildRoundRobinRounds(teamIds);
  const takeRounds = rrRounds.slice(0, Math.min(numMatches, rrRounds.length));
  const matches = [];
  const playedCount = {}, playedAgainst = {};
  teamIds.forEach(id => { playedCount[id]=0; playedAgainst[id]=new Set(); });

  function addMatch(a, b, round){
    playedCount[a]++; playedCount[b]++;
    playedAgainst[a].add(b); playedAgainst[b].add(a);
    matches.push({
      id: genId(), home:a, away:b, round,
      homeScore:null, awayScore:null, played:false, photo:null, playedAt:null,
      stats:{home:[], away:[]}, potm:null, statsPhoto:null, teamStats:{home:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}, away:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}}, goalEvents:[]
    });
  }

  takeRounds.forEach((pairs, ri) => {
    const ordered = shuffleArray(pairs);
    ordered.forEach(([a,b]) => addMatch(a, b, ri+1));
  });

  // Repair pass: top up any team short of numMatches (odd-count byes etc.)
  let extraRound = takeRounds.length + 1;
  for(let attempt=0; attempt<200; attempt++){
    const short = teamIds.filter(id => playedCount[id] < numMatches);
    if(short.length < 2) break;
    const shuffledShort = shuffleArray(short);
    let pairedThisPass = false;
    for(let i=0;i<shuffledShort.length;i++){
      for(let j=i+1;j<shuffledShort.length;j++){
        const a = shuffledShort[i], b = shuffledShort[j];
        if(playedCount[a] < numMatches && playedCount[b] < numMatches && !playedAgainst[a].has(b)){
          addMatch(a, b, extraRound);
          pairedThisPass = true;
        }
      }
    }
    extraRound++;
    if(!pairedThisPass) break; // no valid pairing left — rare odd-count edge case
  }

  assignBalancedHomeAway(teamIds, matches);
  return matches;
}

/* Guarantees an exact home/away split per team whenever mathematically
   possible (i.e. every team's match count is even — true for the default
   8-a-side Swiss setup). Works by finding an Eulerian circuit through each
   team's set of matches and orienting home/away along the traversal
   direction, which is the standard technique for splitting a graph's edges
   evenly per vertex. Falls back to a simple greedy balance for any team
   left with an odd match count (rare edge case). */
function findEulerianCircuit(adj, start){
  const stack = [start];
  const circuit = [];
  const idxPtr = new Map();
  while(stack.length){
    const v = stack[stack.length-1];
    const list = adj.get(v);
    let i = idxPtr.get(v) || 0;
    while(i < list.length && list[i].used) i++;
    idxPtr.set(v, i);
    if(i < list.length){
      const edge = list[i];
      edge.used = true;
      const rev = adj.get(edge.to).find(e => e.key === edge.key && !e.used);
      if(rev) rev.used = true;
      stack.push(edge.to);
    } else {
      circuit.push(stack.pop());
    }
  }
  return circuit.reverse();
}

function assignBalancedHomeAway(teamIds, matches){
  const matchByPairKey = new Map();
  matches.forEach(m => matchByPairKey.set([m.home, m.away].sort().join('|'), m));

  const degree = {}; teamIds.forEach(id => degree[id]=0);
  matches.forEach(m => { degree[m.home]++; degree[m.away]++; });

  const parent = {}; teamIds.forEach(id => parent[id]=id);
  function find(x){ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
  function union(a,b){ const ra=find(a), rb=find(b); if(ra!==rb) parent[ra]=rb; }
  matches.forEach(m => union(m.home, m.away));

  const components = {};
  teamIds.forEach(id => { const r = find(id); (components[r]=components[r]||[]).push(id); });

  Object.values(components).forEach(compTeams => {
    const compSet = new Set(compTeams);
    const compEdges = matches.filter(m => compSet.has(m.home));
    if(compEdges.length === 0) return;
    const allEven = compTeams.every(id => degree[id] % 2 === 0);

    if(allEven){
      const adj = new Map();
      compTeams.forEach(id => adj.set(id, []));
      compEdges.forEach(m => {
        const key = [m.home, m.away].sort().join('|');
        adj.get(m.home).push({ to:m.away, key, used:false });
        adj.get(m.away).push({ to:m.home, key, used:false });
      });
      const circuit = findEulerianCircuit(adj, compTeams[0]);
      for(let i=0;i<circuit.length-1;i++){
        const away = circuit[i], home = circuit[i+1];
        const key = [away,home].sort().join('|');
        const m = matchByPairKey.get(key);
        if(m){ m.home = home; m.away = away; }
      }
    } else {
      const homeCount = {}; compTeams.forEach(id=>homeCount[id]=0);
      shuffleArray(compEdges).forEach(m => {
        if(homeCount[m.home] > homeCount[m.away]){ const tmp=m.home; m.home=m.away; m.away=tmp; }
        homeCount[m.home]++;
      });
    }
  });
}

/* ---------------- Swiss League team statistics ---------------- */
function computeSwissTeamStats(t){
  const standings = computeSwissStandings(t.teams, t.matches);
  const played = t.matches.filter(m => m.played).sort((a,b) => (a.playedAt||0)-(b.playedAt||0));
  const streaks = {};
  t.teams.forEach(team => streaks[team.id] = { winStreak:0, bestWinStreak:0, unbeatenStreak:0, bestUnbeatenStreak:0 });
  played.forEach(m => {
    [ [m.home, m.homeScore, m.awayScore], [m.away, m.awayScore, m.homeScore] ].forEach(([teamId, gf, ga]) => {
      const s = streaks[teamId];
      if(!s) return;
      if(gf > ga){ s.winStreak++; s.unbeatenStreak++; }
      else if(gf === ga){ s.winStreak = 0; s.unbeatenStreak++; }
      else { s.winStreak = 0; s.unbeatenStreak = 0; }
      s.bestWinStreak = Math.max(s.bestWinStreak, s.winStreak);
      s.bestUnbeatenStreak = Math.max(s.bestUnbeatenStreak, s.unbeatenStreak);
    });
  });
  return standings.map(row => ({ ...row, ...streaks[row.id] }));
}


function computeSwissStandings(teams, matches){
  const base = computeStandings(teams, matches);
  const h2h = (aId, bId) => {
    let aPts = 0, bPts = 0, played = false;
    matches.filter(m => m.played).forEach(m => {
      if(m.home===aId && m.away===bId){ played=true; if(m.homeScore>m.awayScore) aPts+=3; else if(m.homeScore<m.awayScore) bPts+=3; else { aPts+=1; bPts+=1; } }
      if(m.home===bId && m.away===aId){ played=true; if(m.homeScore>m.awayScore) bPts+=3; else if(m.homeScore<m.awayScore) aPts+=3; else { aPts+=1; bPts+=1; } }
    });
    return { played, diff: aPts - bPts };
  };
  return base.sort((x, y) => {
    if(y.Pts !== x.Pts) return y.Pts - x.Pts;
    if(y.GD !== x.GD) return y.GD - x.GD;
    if(y.GF !== x.GF) return y.GF - x.GF;
    const h = h2h(x.id, y.id);
    if(h.played && h.diff !== 0) return -h.diff;
    return x.name.localeCompare(y.name);
  });
}

/* ---------------- knockout bracket ---------------- */
function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }
function roundName(matchCount){
  if(matchCount === 1) return "Final";
  if(matchCount === 2) return "Semifinal";
  if(matchCount === 4) return "Quarterfinal";
  return "Round of " + (matchCount*2);
}
function getWinner(m){
  if(!m) return null;
  if(m.away === null && m.home) return m.home;
  if(m.home === null && m.away) return m.away;
  if(m.played && m.homeScore!=null && m.awayScore!=null){
    if(m.homeScore > m.awayScore) return m.home;
    if(m.awayScore > m.homeScore) return m.away;
  }
  return null;
}
function buildKnockout(qualifiers){
  // qualifiers: array of teamIds already ordered by seed (best first)
  const size = nextPow2(qualifiers.length);
  const slots = new Array(size).fill(null);
  qualifiers.forEach((id,i) => slots[i] = id);
  const round1 = [];
  for(let i=0;i<size/2;i++){
    const home = slots[i], away = slots[size-1-i];
    round1.push({
      id: genId(), home, away,
      homeScore:null, awayScore:null,
      played: (away===null && home) ? true : false,
      photo:null, stats:{home:[], away:[]}, potm:null, statsPhoto:null, teamStats:{home:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}, away:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}}, goalEvents:[]
    });
  }
  const rounds = [{ matches: round1 }];
  let count = round1.length;
  while(count > 1){
    count = count/2;
    rounds.push({ matches: Array.from({length:count}, () => ({
      id: genId(), home:null, away:null, homeScore:null, awayScore:null, played:false, photo:null,
      stats:{home:[], away:[]}, potm:null, statsPhoto:null, teamStats:{home:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}, away:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}}, goalEvents:[]
    })) });
  }
  refreshKnockoutRounds(rounds);
  return rounds;
}
function refreshKnockoutRounds(rounds){
  for(let r=1;r<rounds.length;r++){
    const prev = rounds[r-1], cur = rounds[r];
    for(let i=0;i<cur.matches.length;i++){
      const w1 = getWinner(prev.matches[i*2]);
      const w2 = getWinner(prev.matches[i*2+1]);
      cur.matches[i].home = w1;
      cur.matches[i].away = w2;
      if(!cur.matches[i].played){ cur.matches[i].homeScore=null; cur.matches[i].awayScore=null; }
    }
  }
}

const root = document.getElementById('root');

function render(){
  if(state.loading){ root.innerHTML = renderLoading(); return; }
  let html = renderTopbar();
  if(state.view === 'no-backend') html += renderNoBackend();
  else if(state.view === 'login') html += renderAuthScreen('login');
  else if(state.view === 'signup') html += renderAuthScreen('signup');
  else if(state.view === 'pending') html += renderPending();
  else if(state.view === 'suspended') html += renderSuspended();
  else if(state.view === 'admin') html += renderAdminDashboard();
  else if(state.view === 'public-viewer') html += (state.currentTournament ? renderTournamentView() : renderPublicNotFound());
  else if(state.view === 'home') html += renderHome();
  else if(state.view === 'new') html += renderNewForm();
  else if(state.view === 'tournament' && state.currentTournament) html += renderTournamentView();
  html += `<div class="footer-note">MATCHDAY · tournament management platform</div>`;
  if(state.modal) html += renderModal();
  root.innerHTML = html;
  attachEvents();
}

  const unlocked = canEditTournament(t);
  const isPublicView = state.view === 'public-viewer';
  let tabs = t.type === 'league'
    ? [['standings','Standings'],['fixtures','Fixtures & Results'],['awards','Awards'],['insights','Insights'],['summary','Summary']]
    : t.type === 'swiss'
    ? [['standings','League Table'],['fixtures','Fixtures & Results'],['stats','Statistics'],['awards','Awards'],['insights','Insights'],['summary','Summary']]
    : [['groups','Groups'],['bracket','Knockout'],['awards','Awards'],['insights','Insights'],['summary','Summary']];

  let body = '';
  if(state.activeTab === 'awards'){
    body = renderAwards(t);
  } else if(state.activeTab === 'insights'){
    body = renderInsights(t);
  } else if(state.activeTab === 'summary'){
    body = renderSummary(t);
  } else if(t.type === 'league'){
    body = state.activeTab === 'standings' ? renderLeagueStandings(t) : renderLeagueFixtures(t, unlocked);
  } else if(t.type === 'swiss'){
    body = state.activeTab === 'standings' ? renderSwissStandings(t, unlocked)
         : state.activeTab === 'stats' ? renderSwissStatistics(t)
         : renderSwissFixtures(t, unlocked);
  } else {
    body = state.activeTab === 'groups' ? renderCupGroups(t, unlocked) : renderCupBracket(t, unlocked);
  }

  let lockBoxHtml = '';
  if(isPublicView){
    lockBoxHtml = `<span class="lock-status">Public View</span>`;
  } else if(unlocked){
    lockBoxHtml = `
      <span class="lock-status unlocked">● You manage this</span>
      <button class="btn btn-sm" data-action="manage-teams">Manage Teams</button>
      <button class="btn btn-sm" data-action="copy-public-link" data-id="${t.id}">${state.copiedLink ? 'Copied!' : 'Copy Public Link'}</button>
      <button class="btn btn-sm btn-danger" data-action="delete-tournament">Delete</button>`;
  } else if(isAdmin()){
    lockBoxHtml = `
      <span class="lock-status">Admin view (read-only)</span>
      <button class="btn btn-sm" data-action="copy-public-link" data-id="${t.id}">${state.copiedLink ? 'Copied!' : 'Copy Public Link'}</button>
      <button class="btn btn-sm btn-danger" data-action="delete-tournament">Delete</button>`;
  }

  const createdYear = t.createdAt ? new Date(t.createdAt).getFullYear() : new Date().getFullYear();
  const headerHtml = t.type === 'swiss' ? `
  <div class="ucl-hero">
    <div class="ucl-hero-season">${createdYear} / ${String((createdYear+1)%100).padStart(2,'0')} SEASON</div>
    <h1 class="ucl-hero-title">${escapeHtml(t.name)}</h1>
    <div class="ucl-hero-divider"><span></span><span class="ucl-hero-divider-label">League Phase</span><span></span></div>
    <div class="ucl-hero-tagline">${t.teams.length} teams · Top ${t.qualification.directCount} advance direct, top ${t.qualification.playoffEnd} reach the playoffs</div>
  </div>
  <div class="ucl-hero-bottom">
    <div style="display:flex; align-items:center; gap:12px;">
      ${t.logo ? `<img src="${t.logo}" alt="" style="width:38px;height:38px;object-fit:cover;border-radius:4px;border:1px solid var(--border);">` : ''}
      <span class="badge" style="margin:0;">Swiss League</span>
    </div>
    <div class="lock-box">${lockBoxHtml}</div>
  </div>` : `
  <div class="t-header">
    <div style="display:flex; align-items:center; gap:14px;">
      ${t.logo ? `<img src="${t.logo}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:4px;border:1.5px solid var(--border);">` : ''}
      <div>
        <span class="badge">${t.type==='league'?'League':'Cup'}</span>
        <h1>${escapeHtml(t.name)}</h1>
      </div>
    </div>
    <div class="lock-box">${lockBoxHtml}</div>
  </div>`;

  return `
  ${headerHtml}
  <div class="tabs">
    ${tabs.map(([id,label]) => `<div class="tab ${state.activeTab===id?'active':''}" data-action="set-tab" data-tab="${id}">${label}</div>`).join('')}
  </div>
  ${body}
  `;
}

function standingsTableHtml(rows, qualifyCount){
  return `
  <table class="standings">
    <thead><tr>
      <th></th><th class="team-col">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th>
    </tr></thead>
    <tbody>
      ${rows.map((r,i) => `
        <tr class="${qualifyCount && i<qualifyCount ? 'qualify':''}">
          <td><span class="pos-box">${i+1}</span></td>
          <td class="team-name">${escapeHtml(r.name)}</td>
          <td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>
          <td>${r.GF}</td><td>${r.GA}</td><td>${r.GD>0?'+':''}${r.GD}</td>
          <td class="pts">${r.Pts}</td>
          <td><div class="form-pills">${r.form.slice(-5).map(x=>`<span class="pill ${x}">${x}</span>`).join('') || '<span style="color:var(--text-faint);font-size:11px;">—</span>'}</div></td>
        </tr>`).join('')}
    </tbody>
  </table>`;
}

function swissStandingsTableHtml(rows, qualification){
  const direct = qualification?.directCount ?? 0;
  const playoffEnd = qualification?.playoffEnd ?? 0;
  return `
  <table class="standings">
    <thead><tr>
      <th></th><th class="team-col">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th>
    </tr></thead>
    <tbody>
      ${rows.map((r,i) => {
        const pos = i+1;
        const zoneClass = pos<=direct ? 'qual-direct' : pos<=playoffEnd ? 'qual-playoff' : 'qual-out';
        const dot = pos<=direct ? '🟢' : pos<=playoffEnd ? '🟡' : '🔴';
        return `
        <tr class="${zoneClass}">
          <td><span class="pos-box">${pos}</span></td>
          <td class="team-name">${dot} ${escapeHtml(r.name)}</td>
          <td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>
          <td>${r.GF}</td><td>${r.GA}</td><td>${r.GD>0?'+':''}${r.GD}</td>
          <td class="pts">${r.Pts}</td>
          <td><div class="form-pills">${r.form.slice(-5).map(x=>`<span class="pill ${x}">${x}</span>`).join('') || '<span style="color:var(--text-faint);font-size:11px;">—</span>'}</div></td>
        </tr>`;
      }).join('')}
    </tbody>
  </table>`;
}

function renderSwissStandings(t, unlocked){
  const rows = computeSwissStandings(t.teams, t.matches);
  const totalMatches = t.matches.length;
  const playedMatches = t.matches.filter(m=>m.played).length;
  const remaining = totalMatches - playedMatches;
  const leader = rows[0];
  const progressPct = totalMatches ? Math.round((playedMatches/totalMatches)*100) : 0;
  const scheduleLocked = t.matches.some(m=>m.played);

  return `
  <div class="stats-row">
    <div class="stat-widget"><div class="sw-icon">👥</div><div class="sw-value">${t.teams.length}</div><div class="sw-label">Total Teams</div></div>
    <div class="stat-widget"><div class="sw-icon">⚽</div><div class="sw-value">${playedMatches}/${totalMatches}</div><div class="sw-label">Matches Played</div></div>
    <div class="stat-widget"><div class="sw-icon">⏳</div><div class="sw-value">${remaining}</div><div class="sw-label">Remaining</div></div>
  </div>
  <div class="stats-row">
    <div class="stat-widget"><div class="sw-icon">🏆</div><div class="sw-value" style="font-size:17px;">${leader ? escapeHtml(leader.name) : '—'}</div><div class="sw-label">Current Leader</div></div>
    <div class="stat-widget"><div class="sw-icon">📊</div><div class="sw-value">${progressPct}%</div><div class="sw-label">Tournament Progress</div><div class="stat-bar"><div class="stat-bar-fill" style="width:${progressPct}%;"></div></div></div>
  </div>

  <div class="legend-strip">
    <span class="legend-item"><span class="legend-swatch" style="background:var(--success);"></span>Direct Qualification <span class="legend-range">(Top ${t.qualification.directCount})</span></span>
    <span class="legend-item"><span class="legend-swatch" style="background:var(--warning);"></span>Playoff <span class="legend-range">(${t.qualification.directCount+1}–${t.qualification.playoffEnd})</span></span>
    <span class="legend-item"><span class="legend-swatch" style="background:var(--error);"></span>Eliminated <span class="legend-range">(Rest)</span></span>
  </div>

  <div class="standings-scroll panel" style="padding:0;">
    ${swissStandingsTableHtml(rows, t.qualification)}
  </div>

  ${unlocked ? `
  <div class="stage-actions">
    ${!scheduleLocked ? `<button class="btn btn-sm" data-action="regenerate-swiss">Regenerate Fixtures</button>` : `<span class="hint" style="align-self:center;">Schedule locked — first match already played.</span>`}
    <button class="btn btn-sm" data-action="export-standings-image">Export Standings (Image)</button>
    <button class="btn btn-sm" data-action="export-fixtures-csv">Export Fixtures (CSV)</button>
    <button class="btn btn-sm btn-danger" data-action="reset-swiss">Reset Swiss League</button>
  </div>` : ''}
  `;
}

function renderSwissFixtures(t, unlocked){
  const teamsById = Object.fromEntries(t.teams.map(x=>[x.id,x]));
  const rounds = {};
  t.matches.forEach(m => { const r = m.round||1; (rounds[r] = rounds[r]||[]).push(m); });
  const roundNumbers = Object.keys(rounds).map(Number).sort((a,b)=>a-b);
  return `
  <div class="panel">
    ${unlocked ? `<div class="stage-actions"><button class="btn btn-sm" data-action="add-manual-match" data-scope="league">+ Add extra match</button></div>` : ''}
    ${roundNumbers.map(rn => `
      <div class="group-block">
        <div class="group-title">Round ${rn}</div>
        <div class="match-list">
          ${rounds[rn].map((m,i) => matchCardHtml(m, teamsById, unlocked, 'edit-league-match', '', i)).join('')}
        </div>
      </div>
    `).join('')}
  </div>`;
}

function renderSwissStatistics(t){
  const rows = computeSwissTeamStats(t);
  const active = rows.filter(r => r.P > 0);
  if(active.length === 0){
    return `<div class="empty"><span class="mark-lg">No matches played yet</span>Statistics will appear once results start coming in.</div>`;
  }
  const mostWins = [...active].sort((a,b)=>b.W-a.W)[0];
  const bestAttack = [...active].sort((a,b)=>b.GF-a.GF)[0];
  const bestDefence = [...active].sort((a,b)=>a.GA-b.GA)[0];
  const longestWinStreak = [...active].sort((a,b)=>b.bestWinStreak-a.bestWinStreak)[0];
  const longestUnbeaten = [...active].sort((a,b)=>b.bestUnbeatenStreak-a.bestUnbeatenStreak)[0];

  function card(label, r, statLabel, val, allowZero){
    if(!r || (!allowZero && val<=0)) return `<div class="trophy-card empty-trophy"><div class="trophy-label">${label}</div><div class="hint">No data yet</div></div>`;
    return `<div class="trophy-card"><div class="trophy-label">${label}</div><div class="trophy-name">${escapeHtml(r.name)}</div><div class="trophy-stat">${val} ${escapeHtml(statLabel)}</div></div>`;
  }

  return `
  <div class="trophy-row">
    ${card('Most Wins', mostWins, 'wins', mostWins.W)}
    ${card('Best Attack', bestAttack, 'goals scored', bestAttack.GF)}
    ${card('Best Defence', bestDefence, 'goals conceded', bestDefence.GA, true)}
  </div>
  <div class="trophy-row">
    ${card('Longest Win Streak', longestWinStreak, 'wins in a row', longestWinStreak.bestWinStreak)}
    ${card('Longest Unbeaten Run', longestUnbeaten, 'games unbeaten', longestUnbeaten.bestUnbeatenStreak)}
    <div class="trophy-card"><div class="trophy-label">Top Scorers</div><div class="hint" style="margin-top:8px;">See the Awards tab for individual player goals &amp; assists.</div></div>
  </div>
  `;
}

function renderLeagueStandings(t){
  const rows = computeStandings(t.teams, t.matches);
  return `<div class="standings-scroll panel" style="padding:0;">${standingsTableHtml(rows)}</div>`;
}

function matchCardHtml(m, teamsById, unlocked, kind, extraData, idx){
  const home = teamsById[m.home]?.name || (m.home===null ? 'BYE' : '—');
  const away = teamsById[m.away]?.name || (m.away===null ? 'BYE' : '—');
  const justScored = state.justSavedMatchId === m.id ? ' just-scored' : '';
  const scoreHtml = m.played
    ? `<div class="score-box${justScored}">${m.homeScore} – ${m.awayScore}</div>`
    : `<div class="score-box unplayed">${(m.home===null||m.away===null) ? 'BYE' : 'vs'}</div>`;
  const canClick = unlocked && m.home && m.away;
  const hasStats = (m.stats && ((m.stats.home&&m.stats.home.length) || (m.stats.away&&m.stats.away.length) || (m.potm&&m.potm.name))) || (m.goalEvents&&m.goalEvents.length);
  return `
  <div class="match-card-row anim-pop" style="--i:${idx||0}">
    <div class="match-card ${m.played?'played':''}" ${canClick?`data-action="${kind}" data-mid="${m.id}" ${extraData||''}`:''} style="${canClick?'':'cursor:default;'}">
      ${m.photo ? `<img class="thumb" src="${m.photo}">` : `<span class="thumb-placeholder"></span>`}
      <div class="match-teams">
        <span class="side home">${escapeHtml(home)}</span>
        ${scoreHtml}
        <span class="side away">${escapeHtml(away)}</span>
      </div>
      <span class="thumb-placeholder"></span>
    </div>
    ${(m.played && m.teamStats && Object.values(m.teamStats.home||{}).concat(Object.values(m.teamStats.away||{})).some(v=>v!=null)) ? `
    <div style="padding:2px 4px 0;">
      ${(m.teamStats.home.possession!=null || m.teamStats.away.possession!=null) ? `
      <div class="stat-bar-row" style="margin-bottom:6px;">
        <span class="stat-bar-val">${m.teamStats.home.possession ?? '—'}%</span>
        <div class="stat-bar-track">
          <div class="stat-bar-fill" style="width:${m.teamStats.home.possession ?? 50}%; background:linear-gradient(90deg, var(--gold), rgba(255,215,0,.5));"></div>
          <div class="stat-bar-fill" style="width:${100-(m.teamStats.home.possession ?? 50)}%; background:linear-gradient(270deg, var(--blue), rgba(41,182,246,.5));"></div>
        </div>
        <span class="stat-bar-val">${m.teamStats.away.possession ?? '—'}%</span>
      </div>` : ''}
      <div class="hint" style="text-align:center; margin:0;">
        ${m.teamStats.home.shots!=null || m.teamStats.away.shots!=null ? `Shots ${m.teamStats.home.shots ?? '—'}–${m.teamStats.away.shots ?? '—'}` : ''}
        ${m.teamStats.home.shotsOnGoal!=null || m.teamStats.away.shotsOnGoal!=null ? ` · On Goal ${m.teamStats.home.shotsOnGoal ?? '—'}–${m.teamStats.away.shotsOnGoal ?? '—'}` : ''}
        ${m.teamStats.home.passAccuracy!=null || m.teamStats.away.passAccuracy!=null ? ` · Pass Acc ${m.teamStats.home.passAccuracy ?? '—'}%–${m.teamStats.away.passAccuracy ?? '—'}%` : ''}
        ${m.teamStats.home.fouls!=null || m.teamStats.away.fouls!=null ? ` · Fouls ${m.teamStats.home.fouls ?? '—'}–${m.teamStats.away.fouls ?? '—'}` : ''}
        ${m.teamStats.home.offsides!=null || m.teamStats.away.offsides!=null ? ` · Offsides ${m.teamStats.home.offsides ?? '—'}–${m.teamStats.away.offsides ?? '—'}` : ''}
      </div>
    </div>` : ''}
    ${(m.goalEvents && m.goalEvents.length) ? `
    <div class="hint" style="text-align:center; margin:0;">⚽ ${m.goalEvents.slice().sort((a,b)=>(a.minute||0)-(b.minute||0)).map(g => `${g.minute!=null?g.minute+"' ":''}${escapeHtml(g.player)}`).join(', ')}</div>` : ''}
    ${(unlocked && m.home && m.away) ? `
    <div class="match-actions">
      ${hasStats ? `<span class="stats-badge">✓ stats logged</span>` : ''}
      <button class="btn btn-sm btn-gold" data-action="open-stats" data-kind="${kind}" data-mid="${m.id}" ${extraData||''}>📊 Player &amp; Match Stats</button>
    </div>` : ''}
  </div>`;
}

function renderLeagueFixtures(t, unlocked){
  const teamsById = Object.fromEntries(t.teams.map(x=>[x.id,x]));
  return `
  <div class="panel">
    ${unlocked ? `<div class="stage-actions"><button class="btn btn-sm" data-action="add-manual-match" data-scope="league">+ Add extra match</button></div>` : ''}
    <div class="match-list">
      ${t.matches.map((m,i) => matchCardHtml(m, teamsById, unlocked, 'edit-league-match', '', i)).join('')}
    </div>
  </div>`;
}

function renderCupGroups(t, unlocked){
  const teamsById = Object.fromEntries(t.teams.map(x=>[x.id,x]));
  let out = '';
  t.groups.forEach((g, gi) => {
    const groupTeams = g.teamIds.map(id => teamsById[id]).filter(Boolean);
    const groupMatches = t.groupMatches.filter(m => m.groupIndex === gi);
    const rows = computeStandings(groupTeams, groupMatches);
    out += `
    <div class="group-block">
      <div class="group-title">Group ${g.name}</div>
      <div class="panel">
        ${standingsTableHtml(rows, t.advancePerGroup)}
      </div>
      <div class="match-list">
        ${groupMatches.map((m,i) => matchCardHtml(m, teamsById, unlocked, 'edit-group-match', '', i)).join('')}
      </div>
    </div>`;
  });
  if(unlocked){
    const allPlayed = t.groupMatches.every(m => m.played);
    out += `<div class="stage-actions">
      <button class="btn btn-gold" data-action="generate-bracket" ${t.stage!=='groups'?'disabled':''}>
        ${t.stage==='groups' ? (allPlayed ? 'Generate Knockout Bracket' : 'Generate Knockout Bracket (early)') : 'Bracket already generated'}
      </button>
    </div>
    ${!allPlayed && t.stage==='groups' ? `<div class="hint">Some group games are unplayed — you can still generate the bracket early using current standings, or wait until every group match is done.</div>`:''}`;
  }
  return out;
}

function renderCupBracket(t, unlocked){
  if(t.stage === 'groups'){
    return `<div class="empty"><span class="mark-lg">Bracket not generated yet</span>Finish (or force) the group stage first, from the Groups tab.</div>`;
  }
  const teamsById = Object.fromEntries(t.teams.map(x=>[x.id,x]));
  const rounds = t.knockout.rounds;
  return `
  <div class="hint" style="margin-bottom:6px;">Knockout matches need a winner — if scores are level, enter the final result including extra-time/penalties so one side is ahead.</div>
  <div class="bracket">
    ${rounds.map((rnd, ri) => `
      <div class="bracket-round anim-pop" style="--i:${ri}">
        <div class="round-label">${roundName(rnd.matches.length)}</div>
        ${rnd.matches.map(m => {
          const homeName = m.home ? (teamsById[m.home]?.name||'—') : (ri===0 ? 'TBD' : 'TBD');
          const awayName = m.away ? (teamsById[m.away]?.name||'—') : (m.away===null && m.home && ri===0 ? '' : 'TBD');
          const winner = getWinner(m);
          const isBye = ri===0 && m.away===null && m.home;
          const canClick = unlocked && m.home && m.away;
          const hasStats = (m.stats && ((m.stats.home&&m.stats.home.length) || (m.stats.away&&m.stats.away.length) || (m.potm&&m.potm.name))) || (m.goalEvents&&m.goalEvents.length);
          const justScored = state.justSavedMatchId === m.id ? ' just-scored' : '';
          return `<div class="bk-match ${m.played?'decided':''}${justScored}" ${canClick?`data-action="edit-knockout-match" data-mid="${m.id}" data-round="${ri}"`:''} style="${canClick?'':'cursor:default;'}">
            <div class="bk-side ${winner===m.home?'winner':''}"><span class="nm">${escapeHtml(homeName)}</span><span class="sc">${m.homeScore ?? ''}</span></div>
            <div class="bk-divider"></div>
            ${isBye ? `<div class="bye-tag">BYE — advances free</div>` : `<div class="bk-side ${winner===m.away?'winner':''}"><span class="nm">${escapeHtml(awayName)}</span><span class="sc">${m.awayScore ?? ''}</span></div>`}
            ${canClick ? `<div style="margin-top:8px;display:flex;justify-content:center;gap:6px;" onclick="event.stopPropagation()">
              ${hasStats ? `<span class="stats-badge">✓ logged</span>` : ''}
              <button class="btn btn-sm btn-gold" data-action="open-stats" data-kind="edit-knockout-match" data-mid="${m.id}" data-round="${ri}">📊 Stats</button>
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>
    `).join('')}
  </div>`;
}

function renderAwards(t){
  const players = aggregateStats(t);
  if(players.length === 0){
    return `<div class="empty"><span class="mark-lg">No player stats logged yet</span>Open a match result and tap "Player &amp; match stats" to start tracking goals, assists, cards and clean sheets.</div>`;
  }
  const byGoals = [...players].sort((a,b)=> b.goals-a.goals || b.assists-a.assists)[0];
  const byPotm = [...players].sort((a,b)=> b.potm-a.potm || (b.goals+b.assists)-(a.goals+a.assists))[0];
  const byCleanSheets = [...players].sort((a,b)=> b.cleanSheets-a.cleanSheets)[0];
  const topFouls = [...players].sort((a,b)=>b.fouls-a.fouls).slice(0,5).filter(p=>p.fouls>0);
  const topOffsides = [...players].sort((a,b)=>b.offsides-a.offsides).slice(0,5).filter(p=>p.offsides>0);
  const topYellows = [...players].sort((a,b)=>b.yellows-a.yellows).slice(0,5).filter(p=>p.yellows>0);
  const topReds = [...players].sort((a,b)=>b.reds-a.reds).slice(0,5).filter(p=>p.reds>0);
  const topScorers = [...players].sort((a,b)=>b.goals-a.goals || b.assists-a.assists).slice(0,8).filter(p=>p.goals>0);
  const topAssists = [...players].sort((a,b)=>b.assists-a.assists || b.goals-a.goals).slice(0,8).filter(p=>p.assists>0);
  const potmRanking = [...players].sort((a,b)=>b.potm-a.potm || (b.goals+b.assists)-(a.goals+a.assists)).slice(0,8).filter(p=>p.potm>0);
  const cleanSheetRanking = [...players].sort((a,b)=>b.cleanSheets-a.cleanSheets).slice(0,8).filter(p=>p.cleanSheets>0);

  function trophyCard(label, p, statLabel, val, i){
    if(!p || val<=0) return `<div class="trophy-card empty-trophy anim-pop" style="--i:${i}"><div class="trophy-label">${label}</div><div class="hint">No data yet</div></div>`;
    return `<div class="trophy-card anim-pop" style="--i:${i}">
      <div class="trophy-label">${label}</div>
      <div class="trophy-name">${escapeHtml(p.name)}</div>
      <div class="trophy-team">${escapeHtml(p.teamName)}</div>
      <div class="trophy-stat">${val} ${escapeHtml(statLabel)}</div>
    </div>`;
  }
  function miniTable(title, rows, field, unit){
    if(rows.length===0) return '';
    return `<div class="group-block">

/* ---------------- insights (rule-based, computed from real match data) ---------------- */
function computeTeamInsights(t){
  const all = collectAllMatches(t).filter(m => m.played && m.home && m.away);
  const stats = {};
  t.teams.forEach(team => stats[team.id] = { id:team.id, name:team.name, played:0, wins:0, draws:0, losses:0, gf:0, ga:0, resultsInOrder:[], possSum:0, possCount:0 });
  all.forEach(m => {
    const h = stats[m.home], a = stats[m.away];
    if(!h || !a) return;
    h.played++; a.played++;
    h.gf += m.homeScore; h.ga += m.awayScore;
    a.gf += m.awayScore; a.ga += m.homeScore;
    let hr, ar;
    if(m.homeScore > m.awayScore){ h.wins++; a.losses++; hr='W'; ar='L'; }
    else if(m.homeScore < m.awayScore){ a.wins++; h.losses++; hr='L'; ar='W'; }
    else { h.draws++; a.draws++; hr='D'; ar='D'; }
    h.resultsInOrder.push(hr); a.resultsInOrder.push(ar);
    if(m.teamStats){
      if(m.teamStats.home?.possession!=null){ h.possSum += m.teamStats.home.possession; h.possCount++; }
      if(m.teamStats.away?.possession!=null){ a.possSum += m.teamStats.away.possession; a.possCount++; }
    }
  });
  const pointsFor = arr => arr.reduce((sum,r) => sum + (r==='W'?3:r==='D'?1:0), 0);
  return Object.values(stats).map(s => {
    const winRate = s.played ? Math.round((s.wins/s.played)*100) : 0;
    const gpg = s.played ? (s.gf/s.played) : 0;
    const conceded = s.played ? (s.ga/s.played) : 0;
    const avgPossession = s.possCount ? Math.round(s.possSum/s.possCount) : null;
    const last3 = s.resultsInOrder.slice(-3);
    const prev = s.resultsInOrder.slice(-6,-3);
    let trend = 'steady';
    if(last3.length>=2 && prev.length>=2){
      const a = pointsFor(last3)/last3.length, b = pointsFor(prev)/prev.length;
      if(a > b+0.4) trend = 'improving';
      else if(a < b-0.4) trend = 'cooling off';
    }
    return { ...s, winRate, gpg, conceded, avgPossession, trend };
  }).sort((x,y) => y.winRate-x.winRate || y.gf-x.gf);
}

function renderInsights(t){
  const rows = computeTeamInsights(t).filter(r => r.played > 0);
  if(rows.length === 0){
    return `<div class="empty"><span class="mark-lg">No results yet</span>Insights build up automatically as match results come in.</div>`;
  }
  const mostClinical = [...rows].sort((a,b)=>b.gpg-a.gpg)[0];
  const tightestDefense = [...rows].sort((a,b)=>a.conceded-b.conceded)[0];
  const hottest = rows.find(r => r.trend === 'improving');

  const anyPossession = rows.some(r => r.avgPossession != null);
  return `
  <div class="hint" style="margin-bottom:14px;">Computed live from your match data — win rates, scoring form, trends. Not a live LLM/AI call (that would need a private API key, which isn't safe to embed in a public site) — just real stats that update instantly as results come in.</div>

      ${hottest ? `<div class="match-card" style="cursor:default;"><div class="match-teams" style="justify-content:flex-start; text-align:left; gap:6px;"><span style="font-weight:700;">In form:</span>&nbsp;${escapeHtml(hottest.name)} are trending up over their last few matches.</div></div>` : ''}

function renderSummary(t){
  const teamsById = Object.fromEntries(t.teams.map(x => [x.id, x]));
  let champion = null, standingsBlock = '';

  if(t.type === 'league'){
    const standings = computeStandings(t.teams, t.matches);
    const complete = t.matches.length > 0 && t.matches.every(m => m.played);
    if(complete && standings[0]) champion = standings[0].name;
    standingsBlock = `<div class="standings-scroll panel" style="padding:0;">${standingsTableHtml(standings)}</div>`;
  } else if(t.type === 'swiss'){
    const standings = computeSwissStandings(t.teams, t.matches);
    const complete = t.matches.length > 0 && t.matches.every(m => m.played);
    if(complete && standings[0]) champion = standings[0].name;
    standingsBlock = `<div class="standings-scroll panel" style="padding:0;">${swissStandingsTableHtml(standings, t.qualification)}</div>`;
  } else {
    if(t.stage === 'knockout' && t.knockout){
      const finalRound = t.knockout.rounds[t.knockout.rounds.length - 1];
      const finalMatch = finalRound.matches[0];
      const winnerId = finalMatch ? getWinner(finalMatch) : null;
      if(winnerId) champion = teamsById[winnerId]?.name || null;
    }
    standingsBlock = t.groups.map((g, gi) => {
      const groupTeams = g.teamIds.map(id => teamsById[id]).filter(Boolean);
      const groupMatches = t.groupMatches.filter(m => m.groupIndex === gi);
      const standings = computeStandings(groupTeams, groupMatches);
      return `<div class="group-block"><div class="group-title">Group ${g.name}</div><div class="standings-scroll panel" style="padding:0;">${standingsTableHtml(standings, t.advancePerGroup)}</div></div>`;
    }).join('');
  }

  const players = aggregateStats(t);
  const topScorer = players.length ? [...players].sort((a,b)=>b.goals-a.goals)[0] : null;
  const potmWinner = players.length ? [...players].sort((a,b)=>b.potm-a.potm)[0] : null;

  return `
  ${champion ? `
  <div class="panel" style="margin-bottom:20px; text-align:center;">
    <div class="trophy-label" style="margin-bottom:6px;">🏆 Tournament Champion</div>
    <div class="trophy-name" style="font-size:34px;">${escapeHtml(champion)}</div>
    <div style="margin-top:16px;">
      <button class="btn btn-gold" data-action="download-certificate" data-champion="${escapeHtml(champion)}" data-sublabel="${escapeHtml(t.name)}">Download Winner Certificate</button>
    </div>
  </div>` : `<div class="hint" style="margin-bottom:16px;">${t.type==='league' ? 'A champion is crowned once every fixture has been played.' : 'A champion is crowned once the Final is decided.'}</div>`}

  <div class="stub"><span class="dash"></span><span class="label">Final Standings</span><span class="dash"></span></div>
  ${standingsBlock}

  ${(topScorer && topScorer.goals>0) || (potmWinner && potmWinner.potm>0) ? `
  <div class="stub"><span class="dash"></span><span class="label">Player Awards</span><span class="dash"></span></div>
  <div class="trophy-row">
    ${topScorer && topScorer.goals>0 ? `<div class="trophy-card"><div class="trophy-label">Top Scorer</div><div class="trophy-name">${escapeHtml(topScorer.name)}</div><div class="trophy-team">${escapeHtml(topScorer.teamName)}</div><div class="trophy-stat">${topScorer.goals} goals</div></div>` : ''}
    ${potmWinner && potmWinner.potm>0 ? `<div class="trophy-card"><div class="trophy-label">Player of the Tournament</div><div class="trophy-name">${escapeHtml(potmWinner.name)}</div><div class="trophy-team">${escapeHtml(potmWinner.teamName)}</div><div class="trophy-stat">${potmWinner.potm} POTM awards</div></div>` : ''}
  </div>` : ''}
  `;
}

function downloadCertificate(champion, tournamentName){
  const canvas = document.createElement('canvas');
  canvas.width = 1200; canvas.height = 800;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#070b0f';
  ctx.fillRect(0,0,1200,800);
  const grad = ctx.createLinearGradient(0,0,1200,800);
  grad.addColorStop(0,'rgba(255,215,0,0.10)');
  grad.addColorStop(1,'rgba(0,200,83,0.10)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,1200,800);

  ctx.strokeStyle = '#FFD700';
  ctx.lineWidth = 4;
  ctx.strokeRect(40,40,1120,720);
  ctx.strokeStyle = 'rgba(0,200,83,0.5)';
  ctx.lineWidth = 2;
  ctx.strokeRect(56,56,1088,688);

  ctx.textAlign = 'center';
  ctx.font = '120px sans-serif';
  ctx.fillText('🏆', 600, 260);

  ctx.fillStyle = '#8899aa';
  ctx.font = '26px monospace';
  ctx.fillText('TOURNAMENT CHAMPION', 600, 330);

  ctx.fillStyle = '#dde4ee';
  ctx.font = 'bold 84px sans-serif';
  ctx.fillText(champion, 600, 450);

  ctx.fillStyle = '#FFD700';
  ctx.font = '30px sans-serif';
  ctx.fillText(tournamentName, 600, 520);

  ctx.fillStyle = '#445566';
  ctx.font = '22px monospace';
  ctx.fillText(new Date().toLocaleDateString(undefined, {year:'numeric', month:'long', day:'numeric'}), 600, 700);

  const link = document.createElement('a');
  link.download = 'champion-certificate.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

function confettiPieces(n){
  const colors = ['var(--gold)','var(--purple)','var(--blue)','var(--green)','#ffffff'];
  let out = '';
  for(let i=0;i<n;i++){
    const left = (Math.random()*100).toFixed(1);
    const delay = (Math.random()*0.4).toFixed(2);
    const dur = (1.5+Math.random()*1.3).toFixed(2);
    const color = colors[i % colors.length];
    const rot = Math.floor(Math.random()*40-20);
    out += `<div class="confetti-piece" style="left:${left}%; background:${color}; animation-duration:${dur}s; animation-delay:${delay}s; transform:rotate(${rot}deg);"></div>`;
  }
  return out;
}
