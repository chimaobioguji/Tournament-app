/* ---------------- events ---------------- */
function attachEvents(){
  root.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', onAction);
  });
  const nameEl = document.getElementById('f-name');
  if(nameEl) nameEl.addEventListener('input', e => state.newForm.name = e.target.value);

  const authEmailEl = document.getElementById('auth-email');
  if(authEmailEl) authEmailEl.addEventListener('input', e => { state.authForm.email = e.target.value; });
  const authPassEl = document.getElementById('auth-password');
  if(authPassEl) authPassEl.addEventListener('input', e => { state.authForm.password = e.target.value; });
  if(authPassEl) authPassEl.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ const btn = root.querySelector('[data-action="do-login"], [data-action="do-signup"]'); if(btn) btn.click(); }
  });

  const numTeamsEl = document.getElementById('f-numteams');
  if(numTeamsEl) numTeamsEl.addEventListener('change', e => { state.newForm.numTeams = parseInt(e.target.value)||2; render(); });
  const roundsEl = document.getElementById('f-rounds');
  if(roundsEl) roundsEl.addEventListener('input', e => state.newForm.rounds = parseInt(e.target.value)||1);
  const numGroupsEl = document.getElementById('f-numgroups');
  if(numGroupsEl) numGroupsEl.addEventListener('input', e => state.newForm.numGroups = parseInt(e.target.value)||1);
  const advEl = document.getElementById('f-advance');
  if(advEl) advEl.addEventListener('input', e => state.newForm.advancePerGroup = parseInt(e.target.value)||1);
  const swissPresetEl = document.getElementById('f-swiss-preset');
  if(swissPresetEl) swissPresetEl.addEventListener('change', e => {
    if(e.target.value !== 'custom') state.newForm.numTeams = parseInt(e.target.value);
    render();
  });
  const swissMatchesEl = document.getElementById('f-swiss-matches');
  if(swissMatchesEl) swissMatchesEl.addEventListener('input', e => state.newForm.swissMatches = parseInt(e.target.value)||1);
  const swissDirectEl = document.getElementById('f-swiss-direct');
  if(swissDirectEl) swissDirectEl.addEventListener('input', e => state.newForm.swissDirect = parseInt(e.target.value)||0);
  const swissPlayoffEl = document.getElementById('f-swiss-playoff');
  if(swissPlayoffEl) swissPlayoffEl.addEventListener('input', e => state.newForm.swissPlayoff = parseInt(e.target.value)||0);
  root.querySelectorAll('[data-team-idx]').forEach(el => {
    el.addEventListener('input', e => {
      const idx = parseInt(el.getAttribute('data-team-idx'));
      state.newForm.teamNames[idx] = e.target.value;
    });
  });
  const photoInput = document.getElementById('photo-input');
  if(photoInput) photoInput.addEventListener('change', onPhotoSelected);
  const possHomeEl = document.getElementById('ts-home-possession');
  const possAwayEl = document.getElementById('ts-away-possession');
  if(possHomeEl && possAwayEl){
    possHomeEl.addEventListener('input', e => {
      const v = parseInt(e.target.value);
      possAwayEl.value = (!isNaN(v) && v>=0 && v<=100) ? (100-v) : '';
    });
    possAwayEl.addEventListener('input', e => {
      const v = parseInt(e.target.value);
      possHomeEl.value = (!isNaN(v) && v>=0 && v<=100) ? (100-v) : '';
    });
  }
  const logoPhotoInput = document.getElementById('logo-photo-input');
  if(logoPhotoInput) logoPhotoInput.addEventListener('change', onLogoPhotoSelected);
  const manageLogoInput = document.getElementById('manage-logo-input');
  if(manageLogoInput) manageLogoInput.addEventListener('change', onManageLogoSelected);
  root.querySelectorAll('[data-team-edit-idx]').forEach(el => {
    el.addEventListener('input', e => {
      const idx = parseInt(el.getAttribute('data-team-edit-idx'));
      state.modal.teamEdits[idx].name = e.target.value;
    });
  });
  const homeGkSelect = document.getElementById('home-gk-select');
  if(homeGkSelect) homeGkSelect.addEventListener('change', e => { state.modal.gk.home = e.target.value; });
  const awayGkSelect = document.getElementById('away-gk-select');
  if(awayGkSelect) awayGkSelect.addEventListener('change', e => { state.modal.gk.away = e.target.value; });

  root.querySelectorAll('[data-stat-field]').forEach(el => {
    el.addEventListener('input', e => {
      const side = el.getAttribute('data-stat-side');
      const idx = parseInt(el.getAttribute('data-stat-idx'));
      const field = el.getAttribute('data-stat-field');
      const val = field === 'name' ? e.target.value : (parseInt(e.target.value) || 0);
      state.modal.stats[side][idx][field] = val;
    });
  });
  root.querySelectorAll('[data-goal-field]').forEach(el => {
    const evt = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(evt, e => {
      const idx = parseInt(el.getAttribute('data-goal-idx'));
      const field = el.getAttribute('data-goal-field');
      const val = field === 'minute' ? (e.target.value === '' ? null : parseInt(e.target.value)) : e.target.value;
      if(field === 'team' && val !== state.modal.goalEvents[idx].team){
        state.modal.goalEvents[idx].team = val;
        render(); // re-render so the scorer datalist swaps to the right roster
        return;
      }
      state.modal.goalEvents[idx][field] = val;
    });
  });
  const statsPhotoInput = document.getElementById('stats-photo-input');
  if(statsPhotoInput) statsPhotoInput.addEventListener('change', onStatsPhotoSelected);
  const potmSelect = document.getElementById('potm-select');
  if(potmSelect) potmSelect.addEventListener('change', e => {
    const v = e.target.value;
    if(!v){ state.modal.potm = null; return; }
    const idx = v.indexOf('|');
    state.modal.potm = { side: v.slice(0,idx), name: v.slice(idx+1) };
  });
}

async function onAction(e){
  const el = e.currentTarget;
  const action = el.getAttribute('data-action');
  state.err = null;
  try{
    await dispatchAction(action, el);
  }catch(err){
    console.error(err);
    state.err = "Something went wrong saving that (" + (err && err.message ? err.message : 'unknown error') + "). Please try again.";
    render();
  }
}

async function dispatchAction(action, el){
  if(action === 'noop'){ /* no-op for public viewer brand click */ }
  else if(action === 'go-home'){ state.view = isAdmin() ? 'admin' : 'home'; state.modal=null; render(); }
  else if(action === 'new-tournament'){ state.view='new'; state.newForm=null; render(); }
  else if(action === 'cancel-new'){ state.view = isAdmin() ? 'admin' : 'home'; render(); }
  else if(action === 'set-type'){ state.newForm.type = el.getAttribute('data-type'); render(); }
  else if(action === 'create-tournament'){ await createTournament(); }
  else if(action === 'open-tournament'){ await openTournament(el.getAttribute('data-id')); }
  else if(action === 'set-tab'){ state.activeTab = el.getAttribute('data-tab'); render(); }
  else if(action === 'close-modal' || action === 'close-modal-bg'){ state.modal=null; state.err=null; render(); }
  else if(action === 'delete-tournament'){ state.modal = {type:'delete-confirm'}; render(); }
  else if(action === 'do-delete'){ await doDelete(); }
  else if(action === 'copy-public-link'){ await copyPublicLink(el.getAttribute('data-id')); }
  else if(action === 'go-login'){ state.view='login'; state.authErr=null; state.err=null; render(); }
  else if(action === 'go-signup'){ state.view='signup'; state.authErr=null; state.err=null; render(); }
  else if(action === 'do-login'){ await handleLogin(); }
  else if(action === 'do-signup'){ await handleSignup(); }
  else if(action === 'logout'){ await handleLogout(); }
  else if(action === 'approve-organizer'){ await handleSetOrganizerStatus(el.getAttribute('data-id'), 'active'); }
  else if(action === 'suspend-organizer'){ await handleSetOrganizerStatus(el.getAttribute('data-id'), 'suspended'); }
  else if(action === 'edit-league-match'){ openScoreModal(el.getAttribute('data-mid'), 'league'); }
  else if(action === 'edit-group-match'){ openScoreModal(el.getAttribute('data-mid'), 'group'); }
  else if(action === 'edit-knockout-match'){ openScoreModal(el.getAttribute('data-mid'), 'knockout', parseInt(el.getAttribute('data-round'))); }
  else if(action === 'trigger-photo'){ document.getElementById('photo-input').click(); }
  else if(action === 'save-score'){ await saveScore(); }
  else if(action === 'clear-result'){ await clearScore(); }
  else if(action === 'generate-bracket'){ await generateBracket(); }
  else if(action === 'regenerate-swiss'){ state.modal = {type:'regenerate-swiss-confirm'}; render(); }
  else if(action === 'confirm-regenerate-swiss'){ await regenerateSwissFixtures(); }
  else if(action === 'reset-swiss'){ state.modal = {type:'reset-swiss-confirm'}; render(); }
  else if(action === 'confirm-reset-swiss'){ await resetSwissLeague(); }
  else if(action === 'export-standings-image'){ exportStandingsImage(); }
  else if(action === 'export-fixtures-csv'){ exportFixturesCSV(); }
  else if(action === 'add-manual-match'){ state.modal = {type:'add-match'}; render(); }
  else if(action === 'confirm-add-match'){ await confirmAddMatch(); }
  else if(action === 'open-stats'){
    const kind = el.getAttribute('data-kind');
    const mid = el.getAttribute('data-mid');
    const roundAttr = el.getAttribute('data-round');
    openStatsModal(kind, mid, roundAttr !== null ? parseInt(roundAttr) : undefined);
  }
  else if(action === 'add-stat-row'){
    const side = el.getAttribute('data-stat-side');
    state.modal.stats[side].push({ id:genId(), name:'', goals:0, assists:0, fouls:0, offsides:0, yellows:0, reds:0 });
    render();
  }
  else if(action === 'add-goal-event'){
    if(!state.modal.goalEvents) state.modal.goalEvents = [];
    state.modal.goalEvents.push({ id:genId(), minute:null, team:'home', player:'' });
    render();
  }
  else if(action === 'remove-goal-event'){
    const idx = parseInt(el.getAttribute('data-goal-idx'));
    state.modal.goalEvents.splice(idx,1);
    render();
  }
  else if(action === 'remove-stat-row'){
    const side = el.getAttribute('data-stat-side');
    const idx = parseInt(el.getAttribute('data-stat-idx'));
    state.modal.stats[side].splice(idx,1);
    render();
  }
  else if(action === 'trigger-stats-photo'){ document.getElementById('stats-photo-input').click(); }
  else if(action === 'run-ocr'){ await runOCR(); }
  else if(action === 'save-stats'){ await saveStats(); }
  else if(action === 'trigger-logo-photo'){ document.getElementById('logo-photo-input').click(); }
  else if(action === 'trigger-manage-logo'){ document.getElementById('manage-logo-input').click(); }
  else if(action === 'manage-teams'){ openManageTeamsModal(); }
  else if(action === 'save-team-edits'){ await saveTeamEdits(); }
  else if(action === 'delete-team'){
    const idx = parseInt(el.getAttribute('data-team-idx-del'));
    await deleteTeam(idx);
  }
  else if(action === 'download-certificate'){ downloadCertificate(el.getAttribute('data-champion'), el.getAttribute('data-sublabel')); }
}

/* ---------------- create / open / delete ---------------- */
async function createTournament(){
  const f = state.newForm;
  if(!f.name || !f.name.trim()){ state.err = "Give your tournament a name."; render(); return; }
  const n = Math.max(2, Math.min(64, f.numTeams||0));
  const teams = [];
  for(let i=0;i<n;i++){
    teams.push({ id: genId(), name: (f.teamNames[i]||'').trim() || `Team ${i+1}` });
  }

  const t = {
    name: f.name.trim(),
    type: f.type,
    teams,
    createdAt: Date.now(),
    rosters: Object.fromEntries(teams.map(x => [x.id, []])),
    logo: f.logoDataUrl || null,
  };

  if(f.type === 'league'){
    t.rounds = Math.max(1, Math.min(6, f.rounds||1));
    t.matches = generateFixtures(teams.map(x=>x.id), t.rounds);
  } else if(f.type === 'swiss'){
    t.numMatches = Math.max(1, Math.min(teams.length-1, f.swissMatches||8));
    t.qualification = {
      directCount: Math.max(0, Math.min(teams.length, f.swissDirect ?? 8)),
      playoffEnd: Math.max(0, Math.min(teams.length, f.swissPlayoff ?? 24)),
    };
    t.matches = generateSwissFixtures(teams.map(x=>x.id), t.numMatches);
  } else {
    const numGroups = Math.max(1, Math.min(8, f.numGroups||1));
    t.advancePerGroup = Math.max(1, Math.min(4, f.advancePerGroup||1));
    const groups = Array.from({length:numGroups}, (_,i) => ({ name: String.fromCharCode(65+i), teamIds: [] }));
    teams.forEach((team, i) => groups[i % numGroups].teamIds.push(team.id));
    t.groups = groups;
    t.groupMatches = [];
    groups.forEach((g, gi) => {
      const ms = generateFixtures(g.teamIds, 1);
      ms.forEach(m => m.groupIndex = gi);
      t.groupMatches.push(...ms);
    });
    t.stage = 'groups';
    t.knockout = null;
  }

  let created;
  try{
    created = await createTournamentRow(t);
  }catch(err){
    console.error('Save failed:', err);
    const detail = (err && (err.message || err.details || err.hint)) || JSON.stringify(err);
    state.err = "Couldn't save the tournament — " + detail;
    render();
    return;
  }
  state.tournamentsIndex.push(indexEntry(created));
  state.currentTournament = created;
  state.view = 'tournament';
  state.activeTab = (created.type==='league' || created.type==='swiss') ? 'standings' : 'groups';
  render();
}

function indexEntry(t){
  const matchCount = (t.type==='league' || t.type==='swiss') ? t.matches.length : t.groupMatches.length;
  const stageLabel = t.type==='cup' ? (t.stage==='groups' ? 'Group stage' : 'Knockout') : '';
  return { id:t.id, name:t.name, type:t.type, teamCount:t.teams.length, matchCount, stageLabel, organizer_id:t.organizer_id };
}
async function refreshIndexEntry(t){
  const idx = state.tournamentsIndex.findIndex(x=>x.id===t.id);
  if(idx>=0) state.tournamentsIndex[idx] = indexEntry(t);
}

/* ---------------- team management ---------------- */
function openManageTeamsModal(){
  const t = state.currentTournament;
  state.modal = {
    type:'manage-teams',
    teamEdits: t.teams.map(x => ({ id:x.id, name:x.name })),
    logoDataUrl: t.logo || null,
  };
  state.err = null;
  render();
}

async function saveTeamEdits(){
  const t = state.currentTournament;
  const md = state.modal;
  md.teamEdits.forEach(edit => {
    const team = t.teams.find(x => x.id === edit.id);
    if(team && edit.name && edit.name.trim()) team.name = edit.name.trim();
  });
  t.logo = md.logoDataUrl || null;
  await saveTournament(t);
  await refreshIndexEntry(t);
  state.modal = null; state.err = null;
  render();
}

async function deleteTeam(idx){
  const t = state.currentTournament;
  const md = state.modal;
  const editEntry = md.teamEdits[idx];
  const team = editEntry ? t.teams.find(x => x.id === editEntry.id) : null;
  if(!team) return;

  if(t.type === 'cup' && t.stage !== 'groups'){
    state.err = "Can't remove a team once the knockout bracket has been generated. Delete the tournament and start over if you need to change the lineup.";
    render();
    return;
  }
  if(t.teams.length <= 2){
    state.err = "A tournament needs at least 2 teams.";
    render();
    return;
  }

  t.teams = t.teams.filter(x => x.id !== team.id);
  if(t.type === 'league'){
    t.matches = t.matches.filter(m => m.home !== team.id && m.away !== team.id);
  } else {
    t.groups.forEach(g => { g.teamIds = g.teamIds.filter(id => id !== team.id); });
    t.groupMatches = t.groupMatches.filter(m => m.home !== team.id && m.away !== team.id);
  }
  if(t.rosters) delete t.rosters[team.id];

  await saveTournament(t);
  await refreshIndexEntry(t);
  md.teamEdits = md.teamEdits.filter(e => e.id !== team.id);
  state.err = null;
  render();
}

async function openTournament(id){
  state.loading = true; render();
  let t = null;
  try{ t = await loadTournamentRow(id); }catch(err){ t = null; }
  state.loading = false;
  if(!t){ state.view = state.profile ? (isAdmin() ? 'admin' : 'home') : 'login'; render(); return; }
  state.currentTournament = t;
  state.view = 'tournament';
  state.activeTab = (t.type==='league' || t.type==='swiss') ? 'standings' : 'groups';
  render();
}

async function handleSignup(){
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  if(!email || !password){ state.authErr = "Enter an email and password."; render(); return; }
  if(password.length < 6){ state.authErr = "Password must be at least 6 characters."; render(); return; }
  try{
    const data = await doSignup(email, password);
    if(data.session){
      state.session = data.session;
      await routeAfterAuth();
    } else {
      state.authErr = null;
      state.view = 'login';
      state.err = "Account created — check your email to confirm it, then log in.";
      render();
    }
  }catch(err){
    state.authErr = (err && err.message) || "Couldn't sign up.";
    render();
  }
}

/* ---------------- score editing ---------------- */
function openScoreModal(matchId, kind, roundIdx){
  const t = state.currentTournament;
  let match, groupLabel='', roundLabel='';
  if(kind==='league'){ match = t.matches.find(m=>m.id===matchId); }
  else if(kind==='group'){
    match = t.groupMatches.find(m=>m.id===matchId);
    const g = t.groups[match.groupIndex];
    groupLabel = 'Group ' + g.name;
  } else {
    match = t.knockout.rounds[roundIdx].matches.find(m=>m.id===matchId);
    roundLabel = roundName(t.knockout.rounds[roundIdx].matches.length);
  }
  state.modal = { type:'score', kind, roundIdx, match, groupLabel, roundLabel };
  render();
}

async function saveScore(){
  const hs = document.getElementById('score-home').value;
  const as = document.getElementById('score-away').value;
  if(hs === '' || as === ''){ state.err = "Enter both scores."; render(); return; }
  const homeScore = parseInt(hs), awayScore = parseInt(as);
  if(isNaN(homeScore) || isNaN(awayScore) || homeScore<0 || awayScore<0){ state.err = "Scores must be 0 or higher."; render(); return; }

  const t = state.currentTournament;
  const md = state.modal;

  if(md.kind === 'knockout' && homeScore === awayScore){
    state.err = "Knockout ties need a winner — adjust the score to reflect extra time or penalties.";
    render(); return;
  }

  const photo = md.photoDataUrl !== undefined ? md.photoDataUrl : md.match.photo;
  const statKeys = ['shots','shotsOnGoal','possession','passAccuracy','fouls','offsides'];
  function readStatVal(side, key){
    const raw = document.getElementById(`ts-${side}-${key}`)?.value;
    if(raw === '' || raw == null) return null;
    const n = parseInt(raw);
    if(isNaN(n)) return null;
    const capped = (key==='possession'||key==='passAccuracy') ? Math.max(0, Math.min(100, n)) : Math.max(0, n);
    return capped;
  }
  const teamStats = {
    home: Object.fromEntries(statKeys.map(k => [k, readStatVal('home', k)])),
    away: Object.fromEntries(statKeys.map(k => [k, readStatVal('away', k)])),
  };
  const patch = { homeScore, awayScore, played:true, photo, playedAt: Date.now(), teamStats };

  let celebration = null;
  if(md.kind === 'league'){
    const m = t.matches.find(x=>x.id===md.match.id); Object.assign(m, patch);
    if(t.matches.every(x=>x.played)){
      const standings = t.type === 'swiss' ? computeSwissStandings(t.teams, t.matches) : computeStandings(t.teams, t.matches);
      if(standings[0]) celebration = { label: t.type === 'swiss' ? 'Swiss League Winner' : 'League Champion', champion: standings[0].name };
    }
  } else if(md.kind === 'group'){
    const m = t.groupMatches.find(x=>x.id===md.match.id); Object.assign(m, patch);
  } else {
    const m = t.knockout.rounds[md.roundIdx].matches.find(x=>x.id===md.match.id); Object.assign(m, patch);
    refreshKnockoutRounds(t.knockout.rounds);
    if(md.roundIdx === t.knockout.rounds.length - 1){
      const winnerId = getWinner(m);
      if(winnerId){
        const teamsById = Object.fromEntries(t.teams.map(x=>[x.id,x]));
        celebration = { label:'Tournament Champion', champion: teamsById[winnerId]?.name || 'Champion' };
      }
    }
  }

  await saveTournament(t);
  await refreshIndexEntry(t);
  state.justSavedMatchId = md.match.id;
  state.modal = celebration ? { type:'celebration', ...celebration } : null;
  state.err=null;
  render();
  state.justSavedMatchId = null;
}

async function clearScore(){
  const t = state.currentTournament;
  const md = state.modal;
  const patch = { homeScore:null, awayScore:null, played:false, photo:null, playedAt:null, teamStats:{home:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}, away:{shots:null, shotsOnGoal:null, possession:null, passAccuracy:null, fouls:null, offsides:null}} };
  if(md.kind === 'league'){ Object.assign(t.matches.find(x=>x.id===md.match.id), patch); }
  else if(md.kind === 'group'){ Object.assign(t.groupMatches.find(x=>x.id===md.match.id), patch); }
  else {
    Object.assign(t.knockout.rounds[md.roundIdx].matches.find(x=>x.id===md.match.id), patch);
    refreshKnockoutRounds(t.knockout.rounds);
  }
  await saveTournament(t);
  await refreshIndexEntry(t);
  state.modal = null;
  render();
}

/* ---------------- player & match stats ---------------- */
function findMatchByRef(t, kind, matchId, roundIdx){
  if(kind === 'edit-league-match') return t.matches.find(m=>m.id===matchId);
  if(kind === 'edit-group-match') return t.groupMatches.find(m=>m.id===matchId);
  return t.knockout.rounds[roundIdx].matches.find(m=>m.id===matchId);
}

function openStatsModal(kind, matchId, roundIdx){
  const t = state.currentTournament;
  const match = findMatchByRef(t, kind, matchId, roundIdx);
  if(!match) return;
  const statsClone = {
    home: (match.stats?.home || []).map(r => ({...r})),
    away: (match.stats?.away || []).map(r => ({...r})),
  };
  state.modal = {
    type:'stats', kind, roundIdx, matchId,
    stats: statsClone,
    potm: match.potm ? {...match.potm} : null,
    statsPhoto: match.statsPhoto || null,
    ocrText: null,
    gk: match.gk ? {...match.gk} : { home:'', away:'' },
    goalEvents: (match.goalEvents || []).map(g => ({...g})),
  };
  state.err = null;
  render();
}

async function onStatsPhotoSelected(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const dataUrl = await compressImage(file);
    state.modal.statsPhoto = dataUrl;
    state.modal.ocrText = null;
    render();
  }catch(err){
    state.err = "Couldn't read that image — try a different file.";
    render();
  }
}

function loadTesseract(){
  return new Promise((resolve, reject) => {
    if(window.Tesseract) return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}

async function runOCR(){
  if(!state.modal.statsPhoto){ state.err = "Upload a screenshot first."; render(); return; }
  state.ocrBusy = true; state.err = null; render();
  try{
    await loadTesseract();
    const { data } = await Tesseract.recognize(state.modal.statsPhoto, 'eng');
    state.modal.ocrText = (data.text || '').trim() || "No readable text found in that screenshot.";
  }catch(err){
    state.err = "Couldn't read the screenshot right now — enter the stats manually below.";
  }
  state.ocrBusy = false;
  render();
}

async function saveStats(){
  const t = state.currentTournament;
  const md = state.modal;
  const match = findMatchByRef(t, md.kind, md.matchId, md.roundIdx);

  const cleanGoalEvents = (md.goalEvents||[])
    .filter(g => g.player && g.player.trim())
    .map(g => ({ minute: g.minute!=null ? Math.max(0, parseInt(g.minute)) : null, team: g.team==='away'?'away':'home', player: g.player.trim() }));

  const goalCounts = { home: {}, away: {} };
  cleanGoalEvents.forEach(g => {
    const key = g.player.toLowerCase();
    goalCounts[g.team][key] = (goalCounts[g.team][key]||0) + 1;
  });

  const clean = side => {
    const rows = md.stats[side]
      .filter(r => r.name && r.name.trim())
      .map(r => ({ name:r.name.trim(), goals:0, assists:+r.assists||0, fouls:+r.fouls||0, offsides:+r.offsides||0, yellows:+r.yellows||0, reds:+r.reds||0 }));
    // apply goal counts from the timeline, creating a row for any scorer not already listed
    Object.entries(goalCounts[side]).forEach(([key, count]) => {
      let row = rows.find(r => r.name.toLowerCase() === key);
      if(!row){
        const original = cleanGoalEvents.find(g => g.team===side && g.player.toLowerCase()===key);
        row = { name: original.player, goals:0, assists:0, fouls:0, offsides:0, yellows:0, reds:0 };
        rows.push(row);
      }
      row.goals = count;
    });
    return rows;
  };

  match.stats = { home: clean('home'), away: clean('away') };
  match.goalEvents = cleanGoalEvents;
  match.potm = (md.potm && md.potm.name && md.potm.name.trim()) ? { side: md.potm.side, name: md.potm.name.trim() } : null;
  match.statsPhoto = md.statsPhoto || null;
  match.gk = { home: (md.gk.home||'').trim(), away: (md.gk.away||'').trim() };

  if(!t.rosters) t.rosters = {};
  if(!t.rosters[match.home]) t.rosters[match.home] = [];
  if(!t.rosters[match.away]) t.rosters[match.away] = [];
  match.stats.home.forEach(r => { if(!t.rosters[match.home].includes(r.name)) t.rosters[match.home].push(r.name); });
  match.stats.away.forEach(r => { if(!t.rosters[match.away].includes(r.name)) t.rosters[match.away].push(r.name); });

  await saveTournament(t);
  state.modal = null; state.err = null; state.ocrBusy = false;
  render();
}

async function confirmAddMatch(){
  const home = document.getElementById('add-home').value;

  await saveTournament(t);
  await refreshIndexEntry(t);
  state.modal = null; state.err=null;
  render();
}

async function regenerateSwissFixtures(){

function exportFixturesCSV(){
  const t = state.currentTournament;
  const teamsById = Object.fromEntries(t.teams.map(x=>[x.id,x]));
  const rows = [['Round','Home','Away','Home Score','Away Score','Played']];
  t.matches.forEach(m => {
    rows.push([
      m.round||1,
      teamsById[m.home]?.name||'',
      teamsById[m.away]?.name||'',
      m.homeScore ?? '',
      m.awayScore ?? '',
      m.played ? 'Yes' : 'No'
    ]);
  });
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = (t.name || 'fixtures').replace(/[^a-z0-9]/gi,'-').toLowerCase() + '-fixtures.csv';
  link.click();
}

function exportStandingsImage(){
  const t = state.currentTournament;
  const rows = computeSwissStandings(t.teams, t.matches);
  const direct = t.qualification.directCount, playoffEnd = t.qualification.playoffEnd;
  const rowH = 30, headerH = 90, footerH = 30;
  const width = 760, height = headerH + rows.length*rowH + footerH;
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#F8FAFC'; ctx.fillRect(0,0,width,height);
  ctx.fillStyle = '#0F172A';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText(t.name, 20, 34);
  ctx.fillStyle = '#64748B';
  ctx.font = '13px sans-serif';
  ctx.fillText('Swiss League — Standings', 20, 54);

  const cols = [
    { label:'#', x:20, w:26 },
    { label:'Team', x:50, w:230 },
    { label:'P', x:290, w:32 },
    { label:'W', x:325, w:32 },
    { label:'D', x:360, w:32 },
    { label:'L', x:395, w:32 },
    { label:'GF', x:430, w:34 },
    { label:'GA', x:466, w:34 },
    { label:'GD', x:502, w:36 },
    { label:'Pts', x:545, w:40 },
  ];
  const tableTop = headerH - 20;
  ctx.font = 'bold 11px monospace';
  ctx.fillStyle = '#94A3B8';
  cols.forEach(c => ctx.fillText(c.label.toUpperCase(), c.x, tableTop));

  rows.forEach((r, i) => {
    const y = headerH + i*rowH;
    const pos = i+1;
    const zoneColor = pos<=direct ? '#22C55E' : pos<=playoffEnd ? '#F59E0B' : '#EF4444';
    ctx.fillStyle = pos<=direct ? 'rgba(34,197,94,.08)' : pos<=playoffEnd ? 'rgba(245,158,11,.08)' : 'rgba(239,68,68,.05)';
    ctx.fillRect(14, y-20, width-28, rowH-4);
    ctx.fillStyle = zoneColor;
    ctx.beginPath(); ctx.arc(28, y-6, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0F172A';
    ctx.font = '12px monospace';
    ctx.fillText(String(pos), 22, y);
    ctx.font = '600 13px sans-serif';
    ctx.fillText(r.name.length>26 ? r.name.slice(0,25)+'…' : r.name, 50, y);
    ctx.font = '12px monospace';
    ctx.fillStyle = '#334155';
    ctx.fillText(String(r.P), 290, y);
    ctx.fillText(String(r.W), 325, y);
    ctx.fillText(String(r.D), 360, y);
    ctx.fillText(String(r.L), 395, y);
    ctx.fillText(String(r.GF), 430, y);
    ctx.fillText(String(r.GA), 466, y);
    ctx.fillText((r.GD>0?'+':'')+r.GD, 502, y);
    ctx.font = 'bold 12px monospace';
    ctx.fillStyle = '#16A34A';
    ctx.fillText(String(r.Pts), 545, y);
  });

  ctx.fillStyle = '#94A3B8';
  ctx.font = '11px monospace';
  ctx.fillText('🟢 Direct  🟡 Playoff  🔴 Eliminated', 20, height-12);

  const link = document.createElement('a');
  link.download = (t.name || 'standings').replace(/[^a-z0-9]/gi,'-').toLowerCase() + '-standings.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function generateBracket(){
  const t = state.currentTournament;
  const qualifiers = []; // ordered: all 1st place, then all 2nd place, etc
  for(let pos=0; pos<t.advancePerGroup; pos++){
    t.groups.forEach((g, gi) => {
      const groupTeams = g.teamIds.map(id => t.teams.find(x=>x.id===id)).filter(Boolean);
      const groupMatches = t.groupMatches.filter(m => m.groupIndex === gi);
      const standings = computeStandings(groupTeams, groupMatches);
      if(standings[pos]) qualifiers.push(standings[pos].id);
    });
  }
  if(qualifiers.length < 2){ state.err = "Need at least 2 qualifying teams."; render(); return; }
  t.knockout = { rounds: buildKnockout(qualifiers) };
  t.stage = 'knockout';
  await saveTournament(t);
  await refreshIndexEntry(t);
  state.activeTab = 'bracket';
  render();
}

/* ---------------- init ---------------- */
async function routeAfterAuth(){
  const userId = state.session.user.id;
  let profile = null;
  try{ profile = await fetchMyProfile(userId); }catch(e){ profile = null; }
  state.profile = profile;

  if(!profile){
    state.authErr = "Couldn't load your account. Try logging in again.";
    state.view = 'login';
    render();
    return;
  }
  if(profile.role === 'platform_admin'){
    if(profile.status !== 'active'){ state.view = 'suspended'; render(); return; }
    try{
      state.organizers = await loadOrganizers();
      state.tournamentsIndex = await loadMyTournaments();
    }catch(e){}
    state.view = 'admin';
    render();
    return;
  }
  // organizer
  if(profile.status === 'pending'){ state.view = 'pending'; render(); return; }
  if(profile.status === 'suspended'){ state.view = 'suspended'; render(); return; }
  try{ state.tournamentsIndex = await loadMyTournaments(); }catch(e){ state.tournamentsIndex = []; }
  state.view = 'home';
  render();
}

async function init(){
  if(!supabaseClient){
    state.loading = false;
    state.view = 'no-backend';
    render();
    return;
  }

  const params = new URLSearchParams(window.location.search);
  const publicId = params.get('t');
  if(publicId){
    let t = null;
    try{ t = await loadTournamentRow(publicId); }catch(e){ t = null; }
    state.loading = false;
    if(t && t.is_public !== false){
      state.currentTournament = t;
      state.view = 'public-viewer';
      state.activeTab = (t.type==='league' || t.type==='swiss') ? 'standings' : 'groups';
    } else {
      state.view = 'public-viewer';
      state.currentTournament = null;
    }
    render();
    return;
  }

  try{
    const session = await fetchSession();
    state.session = session;
    state.loading = false;
    if(session){
      await routeAfterAuth();
    } else {
      state.view = 'login';
      render();
    }
  }catch(e){
    state.loading = false;
    state.view = 'login';
    render();
  }
}
